name: Auto-merge

# MANUAL-ONLY (2026-08-10): SDDK never depends on CI/CD and releases are
# trunk-based direct to main (no PRs). Auto-merge is inert by design; kept
# only as an optional manual helper if PR flow is ever re-enabled.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Enable auto-merge for CI-green PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find open PRs whose head matches the CI run branch and whose checks are green.
          head_branch="${{ github.event.workflow_run.head_branch }}"
          if [ -z "$head_branch" ] || [ "$head_branch" = "main" ]; then
            echo "skipping: no feature branch in this CI run"
            exit 0
          fi
          pr_number=$(gh pr list --base main --head "$head_branch" --state open --json number -q '.[0].number' || true)
          if [ -z "$pr_number" ]; then
            echo "no open PR for branch $head_branch"
            exit 0
          fi
          echo "enabling auto-merge for PR #$pr_number"
          gh pr merge "$pr_number" --auto --squash --delete-branch || \
            echo "auto-merge enable failed (may already be enabled or policy blocks)"

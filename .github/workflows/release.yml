name: Optional tag distribution

# This workflow consumes an already-pushed release tag. It is not the local
# SDDK release gate: local Git verification of main SHA plus the remote tag is
# authoritative. `release-automation.yml` dispatches this workflow after the
# tag is pushed to distribute signed platform assets and run a real installer
# smoke test before treating the Actions distribution as complete.
#
# MANUAL-ONLY (2026-08-10): no automatic `push: tags: v*` trigger. Distribution
# is invoked explicitly through `workflow_dispatch`, including the explicit
# dispatch performed by release-automation.yml after it pushes a release tag.

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build and publish ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ALL Linux targets are musl STATIC builds: standalone, run on any
          # distribution regardless of glibc version. glibc builds removed
          # (2026-08-06): the installer only ever downloads musl assets.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: sddk-linux-x86_64-musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            asset: sddk-linux-aarch64-musl
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: sddk-darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: sddk-darwin-x86_64
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.91.0 --profile minimal --component rustfmt,clippy
          rustup default 1.91.0

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl cross tools
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target ${{ matrix.target }} -p sddk-cli --locked

      - name: Package dist (checksums + SBOM + attestation)
        run: ./target/${{ matrix.target }}/release/sddk release dist --prefix dist-out --channel release --commit "$GITHUB_SHA"

      - name: Stage assets
        run: |
          # NOT `assets/`: that directory is part of the framework bundle
          # (17 versioned files, 55 entries in MANIFEST.sha256). Staging there
          # made `assets/*` glob the repo's own bundle surface into the
          # release — observed on v2.2.6, which shipped `agent-models.yaml`
          # (a bundle file) and then died on `assets/agent-models: is a
          # directory` when `gh release upload` walked the subdirectory.
          # (INC-DEBT-034)
          STAGE="dist-out/release-assets"
          mkdir -p "$STAGE"
          cp dist-out/dist/sddk "$STAGE/${{ matrix.asset }}"
          cp dist-out/dist/sbom.json "$STAGE/${{ matrix.asset }}.sbom.json"
          cp dist-out/dist/attestation.json "$STAGE/${{ matrix.asset }}.attestation.json"
          cp dist-out/dist/checksums.txt "$STAGE/${{ matrix.asset }}.CHECKSUMS"
          (cd "$STAGE" && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: dist-out/release-assets/*
          if-no-files-found: error

  framework-bundle:
    name: Bundle framework assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Bundle framework (agents/skills/prompts/assets)
        run: |
          mkdir -p bundle
          # The release SHA must already contain the canonical manifest produced
          # by `sddk dev manifest`; never maintain a second producer here.
          test -f MANIFEST.sha256
          tar czf bundle/software-development-decision-kernel.tar.gz agents skills prompts/sddk assets MANIFEST.sha256
          (cd bundle && sha256sum software-development-decision-kernel.tar.gz > software-development-decision-kernel.tar.gz.sha256)
          ls -la bundle/

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sddk-framework
          path: bundle/*
          if-no-files-found: error

  unified-artifact:
    # Cycle-46 (install-coherence-v1.63) capa 3 — single coherent artifact
    # per arch containing the binary AND the framework bundle.
    # Eagerly consumed by scripts/install.sh when available; falls back to
    # the split assets otherwise (legacy releases).
    name: Unified artifact ${{ matrix.asset }}
    needs: [build, framework-bundle]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: sddk-linux-x86_64-musl
          - asset: sddk-linux-aarch64-musl
          - asset: sddk-darwin-arm64
          - asset: sddk-darwin-x86_64
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download binary + framework artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: downloads
          merge-multiple: true

      - name: Assemble unified sddk-${{ github.ref_name }}-${{ matrix.asset }}.tar.gz
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || { echo "manual run: skipping"; exit 0; }

          # Locate the binary for this arch.
          BIN_FILE="downloads/${ASSET}"
          test -f "$BIN_FILE" || { echo "missing binary $BIN_FILE"; exit 1; }
          chmod 0755 "$BIN_FILE"

          # BUNDLE.toml needs the version. Two rules learned on real runs:
          #
          # 1. NEVER execute the target binary to read its version. On the
          #    three non-x86_64 targets it is a foreign ELF/Mach-O and the
          #    x86_64 runner cannot run it (v2.2.9 run 36473855952: exit 126
          #    in all three unified jobs, sign/publish/smoke skipped).
          #    Every unified job downloads the x86_64 binary too, and the
          #    runner executes that one, so the version comes from it.
          #
          # 2. chmod the probe binary FIRST. Artifacts uploaded by the build
          #    jobs do not reliably carry the exec bit back through
          #    download-artifact. In the v2.2.10 run (36476097594) the
          #    x86_64 unified job passed precisely because its own BIN_FILE
          #    (= the probe binary) got `chmod 0755` above, while the other
          #    three jobs died with a SILENT exit 126: the probe ran inside
          #    a command substitution whose `2>&1 | awk` swallowed the
          #    "Permission denied" message, and set -e killed the step.
          #    The probe below keeps stderr LOUD (echoed to the job log and
          #    the error text preserved) while still failing closed.
          test -f downloads/sddk-linux-x86_64-musl || { echo "missing x86_64 binary for version probe"; exit 1; }
          chmod 0755 downloads/sddk-linux-x86_64-musl
          if ! RAW_VERSION="$(./downloads/sddk-linux-x86_64-musl --version 2>&1)"; then
            echo "::error::version probe failed: $RAW_VERSION" >&2
            exit 1
          fi
          BINARY_VERSION="$(printf '%s' "$RAW_VERSION" | awk '{print $NF}')"
          echo "  binary version: $BINARY_VERSION"
          [ -n "$BINARY_VERSION" ] || { echo "BINARY_VERSION is empty — x86_64 binary did not report a version"; exit 1; }

          # Locate the framework bundle.
          BUNDLE="downloads/software-development-decision-kernel.tar.gz"
          test -f "$BUNDLE" || { echo "missing bundle $BUNDLE"; exit 1; }

          # Extract bundle to a working tree.
          WORK="$(mktemp -d)"
          mkdir -p "$WORK/framework"
          tar xzf "$BUNDLE" -C "$WORK/framework"

          # Sanity check: bundle must include the manifest.
          test -f "$WORK/framework/MANIFEST.sha256" \
            || { echo "bundle lacks MANIFEST.sha256"; exit 1; }

          # Place binary at bin/sddk inside the tarball.
          mkdir -p "$WORK/bin"
          cp "$BIN_FILE" "$WORK/bin/sddk"

          # Bundle version: derived above from the runnable x86_64 binary.

          # Generate BUNDLE.toml from the bundle (manifest sha256 already
          # in MANIFEST.sha256; we record its hash here so install.sh
          # doctor can detect tampering). Use printf (not heredoc) so the
          # inner TOML body does not break the YAML `run: |` literal
          # scalar parser when the file is later re-validated.
          #
          # The digest is of MANIFEST.sha256 ITSELF, not of the first line it
          # lists. `awk 'NR==1 {print $1}'` read the digest of
          # agents/analytics-judge.md and published it as the manifest anchor,
          # which `verify_manifest_anchor` (bundle_manifest.rs) rejects on any
          # version not in LEGACY_PUBLISHED_ANCHORS. Same fix as release.sh
          # (session-30); the `sha256:` prefix matches dev manifest's producer
          # so the two formats stop diverging.
          # Pinned by tests/test_release_ci_manifest_anchor.sh.
          MANIFEST_SHA="$(sha256sum "$WORK/framework/MANIFEST.sha256" | cut -d' ' -f1)"
          printf '%s\n' \
            '[bundle]' \
            'schema_version = 2' \
            "version = \"$BINARY_VERSION\"" \
            "binary_min_version = \"$BINARY_VERSION\"" \
            "binary_max_version = \"$BINARY_VERSION\"" \
            '' \
            '[contents]' \
            "manifest_sha256 = \"sha256:$MANIFEST_SHA\"" \
            > "$WORK/framework/BUNDLE.toml"

          # Pack the unified tarball (gz, reproducible layout).
          OUT="sddk-${TAG}-${ASSET}.tar.gz"
          tar -C "$WORK" -czf "$OUT" bin framework

          # Move into downloads so the publish step below picks it up.
          mv "$OUT" "downloads/${OUT}"
          (cd downloads && sha256sum "$OUT" > "$OUT.sha256")

          echo "  unified artifact: downloads/$OUT ($(stat -c%s "downloads/$OUT") bytes)"
          ls -la "downloads/$OUT"*

      - name: Upload unified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unified-${{ matrix.asset }}
          path: downloads/sddk-${{ github.ref_name }}-${{ matrix.asset }}.tar.gz*
          if-no-files-found: error


  canonical-assets:
    name: Assemble canonical release contract
    needs: [build, framework-bundle, unified-artifact]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download build, framework, and unified artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: downloads
          merge-multiple: true

      - name: Assemble canonical payloads, receipt, and platform packages
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          STAGE="release-assets"
          mkdir -p "$STAGE"

          # The 9 canonical payloads consumed by scripts/install.sh and
          # scripts/release-assets-contract.sh. The source binary is the
          # actual x86_64-musl output from the build matrix.
          cp downloads/sddk-linux-x86_64-musl "$STAGE/sddk"
          chmod 0755 "$STAGE/sddk"
          (cd "$STAGE" && sha256sum sddk > sddk.sha256)
          cp downloads/sddk-linux-x86_64-musl.sbom.json "$STAGE/sbom.json"

          UNIFIED="sddk-${TAG}-sddk-linux-x86_64-musl.tar.gz"
          cp "downloads/$UNIFIED" "$STAGE/$UNIFIED"
          cp "downloads/$UNIFIED.sha256" "$STAGE/$UNIFIED.sha256"
          cp downloads/software-development-decision-kernel.tar.gz "$STAGE/"
          cp downloads/software-development-decision-kernel.tar.gz.sha256 "$STAGE/"
          (cd "$STAGE" && sha256sum "$UNIFIED" software-development-decision-kernel.tar.gz > CHECKSUMS)

          # Preserve the other three built platform packages as an explicit,
          # finite extension to the 9-payload contract. The shared gate
          # allowlists these exact names; arbitrary extra assets still fail.
          for asset in sddk-linux-aarch64-musl sddk-darwin-arm64 sddk-darwin-x86_64; do
            name="sddk-${TAG}-${asset}.tar.gz"
            cp "downloads/$name" "$STAGE/$name"
            cp "downloads/$name.sha256" "$STAGE/$name.sha256"
          done

          bash scripts/release-receipt.sh \
            --actor-id github-actions \
            --tag "$TAG" \
            --out "$STAGE/gh-release-receipt.json"

          expected=(
            sddk sddk.sha256 "$UNIFIED" "$UNIFIED.sha256" CHECKSUMS sbom.json
            gh-release-receipt.json software-development-decision-kernel.tar.gz
            software-development-decision-kernel.tar.gz.sha256
          )
          for name in "${expected[@]}"; do
            test -s "$STAGE/$name" || { echo "missing canonical payload: $name" >&2; exit 1; }
          done
          jq -e --arg tag "$TAG" '.surface == "github_releases" and .actor_kind == "System" and .actor_id == "github-actions" and .tag == $tag' \
            "$STAGE/gh-release-receipt.json" >/dev/null
          echo "canonical payload count: ${#expected[@]}"
          ls -la "$STAGE"

      - name: Upload canonical payloads for the signing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: canonical-release-assets
          path: release-assets/*
          if-no-files-found: error

  sign:
    name: Sign release assets (cosign keyless)
    needs: [canonical-assets]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@053f9b74638557590800a301da1ba82351507e2c # v3.8.1
        with:
          # Pinned EXPLICITLY. The action's built-in default is v2.4.3, but
          # leaving it implicit means the cosign that signs a release is
          # decided by a third party's default and can change under us with
          # nothing in this repo to show it. The signature is a security
          # control: the version that produces it is part of the contract.
          # Update deliberately, in its own commit, with the version
          # validated against the flags release.sh uses.
          cosign-release: 'v2.4.3'

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download canonical release assets
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: canonical-release-assets
          path: release-assets
          merge-multiple: true

      - name: Verify the staging directory is populated
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=(release-assets/*)
          if [ "${#found[@]}" -eq 0 ]; then
            echo "::error::no artifacts downloaded to release-assets" >&2
            echo "refusing to report a successful signing job over an empty staging dir" >&2
            exit 1
          fi
          echo "  staged artifacts: ${#found[@]}"
          ls -la release-assets

      - name: Sign every asset (keyless)
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "manual run (no tag): signing skipped"
            exit 0
          fi
          SIGNED=(
            "release-assets/sddk"
            "release-assets/sddk-${TAG}-sddk-linux-x86_64-musl.tar.gz"
            "release-assets/sddk-${TAG}-sddk-linux-aarch64-musl.tar.gz"
            "release-assets/sddk-${TAG}-sddk-darwin-arm64.tar.gz"
            "release-assets/sddk-${TAG}-sddk-darwin-x86_64.tar.gz"
            "release-assets/software-development-decision-kernel.tar.gz"
          )
          for f in "${SIGNED[@]}"; do
            test -s "$f" || { echo "::error::missing signed payload: $f" >&2; exit 1; }
            cosign sign-blob --yes "$f" \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem"
            echo "signed: $f"
          done
          # Exercise the same asset contract used by release.sh before any
          # public release is created. An unsigned/partial set never leaks.
          source scripts/release-assets-contract.sh
          die() { echo "::error::$*" >&2; exit 1; }
          ok() { echo "  ok: $*"; }
          FILES_JSON="$(find release-assets -maxdepth 1 -type f -printf '%f\n' | jq -R . | jq -s 'map({name:.})')"
          RELEASE_JSON="$(jq -n --arg tag "$TAG" --argjson assets "$FILES_JSON" '{tagName:$tag,isDraft:false,isPrerelease:false,assets:$assets}')"
          validate_release_asset_contract "$RELEASE_JSON" "${TAG#v}"

      - name: Upload signed assets for smoke test evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-release-assets
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish the fully staged and signed release
    needs: [sign]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download signed release assets
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: signed-release-assets
          path: release-assets
          merge-multiple: true

      - name: Publish complete release atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # Never delete unknown historical assets. A retry may overwrite only
            # names in this staged set; the post-upload exact allowlist fails
            # closed if the existing release contains anything else.
            gh release upload "$TAG" release-assets/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" release-assets/* --generate-notes --title "$TAG" \
              --repo "${{ github.repository }}"
          fi

          source scripts/release-assets-contract.sh
          die() { echo "::error::$*" >&2; exit 1; }
          ok() { echo "  ok: $*"; }
          RELEASE_JSON="$(gh release view "$TAG" --repo "${{ github.repository }}" --json tagName,isDraft,isPrerelease,assets)"
          [ "$(echo "$RELEASE_JSON" | jq -r '.tagName')" = "$TAG" ] || die "published tagName mismatch"
          [ "$(echo "$RELEASE_JSON" | jq -r '.isDraft')" = false ] || die "release remained draft"
          [ "$(echo "$RELEASE_JSON" | jq -r '.isPrerelease')" = false ] || die "release is prerelease"
          validate_release_asset_contract "$RELEASE_JSON" "${TAG#v}"
          for asset in "${RELEASE_CANONICAL_ASSETS[@]}"; do
            code="$(curl -fsSL -o /dev/null -w '%{http_code}' "https://github.com/${{ github.repository }}/releases/download/$TAG/$asset")"
            [ "$code" = 200 ] || die "canonical asset $asset returned HTTP $code"
          done

  smoke-test:
    name: Smoke test installer (end-to-end)
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install cosign
        uses: sigstore/cosign-installer@053f9b74638557590800a301da1ba82351507e2c # v3.8.1
        with:
          # Same explicit pin as the signing job. This one only installs cosign
          # to VERIFY the release, so it must be able to read what the other
          # one wrote; letting the two drift on a third-party default is how a
          # verification step starts disagreeing with the thing it verifies.
          cosign-release: 'v2.4.3'

      - name: Install via scripts/install.sh against the real release
        env:
          HOME: /tmp/sddk-smoke-home
          SDDK_PREFIX: /tmp/sddk-smoke-prefix
          SDDK_FRAMEWORK_DIR: /tmp/sddk-smoke-framework
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "manual run (no tag): smoke test skipped"
            exit 0
          fi
          bash scripts/install.sh --editor all --version "$TAG" 2>&1 | tee /tmp/smoke-install.log
          grep -q "sha256 verified" /tmp/smoke-install.log
          grep -Fq "signature verified (cosign keyless, identity and issuer pinned)" /tmp/smoke-install.log
          grep -q "agents: 67" /tmp/smoke-install.log || grep -q "agents: " /tmp/smoke-install.log
          grep -q "errors: 0" /tmp/smoke-install.log
          test -L /tmp/sddk-smoke-home/.config/opencode/agents/orchestrator.md
          # INC-A5-FWDIR/ADR-0081: zcode registers PRIMARY_AGENTS as native
          # command files under ~/.zcode/commands/ (since 9942b280, 2026-09-12)
          # and sub-agents as native md files with `name:` frontmatter under
          # ~/.zcode/agents/ (regular files, NOT symlinks — the old symlink pin
          # from 34d68c21 went stale and failed every real smoke since;
          # v2.2.13 run 36485603013 is the observed instance).
          test -f /tmp/sddk-smoke-home/.zcode/commands/orchestrator.md
          test -f /tmp/sddk-smoke-home/.zcode/agents/analytics-judge.md
          grep -q '^name: analytics-judge$' /tmp/sddk-smoke-home/.zcode/agents/analytics-judge.md

      - name: Verify binary, completions, and dev update against the real release
        env:
          HOME: /tmp/sddk-smoke-home
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "manual run (no tag): smoke test skipped"
            exit 0
          fi
          # INC-A5-FWDIR: the default SDDK_PREFIX is $HOME/.local/bin, which
          # does NOT end in /bin, so the binary lands at $PREFIX/bin/sddk
          # (rustup-style nesting, install.sh:488-495). The bare $PREFIX/sddk
          # shape only exists when the prefix itself ends in /bin. Observed
          # failing here on v2.2.15 run 36488888188 (exit 127) after the
          # install step finally went green.
          SDDK=/tmp/sddk-smoke-prefix/bin/sddk
          "$SDDK" --version
          "$SDDK" completion bash | head -1 | grep -q "_sddk"
          "$SDDK" completion zsh | head -1 | grep -q "#compdef"
          mkdir -p /tmp/sddk-smoke-framework-2
          "$SDDK" dev update --root /tmp/sddk-smoke-framework-2 \
            --version "$TAG" --editor all | tee /tmp/smoke-update.log
          grep -q "sha256 verified" /tmp/smoke-update.log
          test -d /tmp/sddk-smoke-framework-2/agents
          test "$(ls /tmp/sddk-smoke-framework-2/agents | wc -l)" -ge 60
          echo "SMOKE TEST PASS"

name: Release automation

# MANUAL-ONLY (2026-08-10): SDDK never depends on CI/CD. The automatic
# 5-minute poll was removed; this robot is dispatched explicitly by a human
# when PR-based release automation is ever wanted again. Original behavior:
#   1. Approves pending CI runs for release/* PRs (allowed by the repo
#      setting "Allow GitHub Actions to create and approve pull requests").
#   2. Ensures auto-merge is enabled for open release PRs so GitHub merges
#      them as soon as their checks pass.
#   3. Opens a release PR when conventional commits since the last tag
#      warrant a bump (scripts/release-bump.sh applies versions + CHANGELOG).
#   4. Pushes the tag when main carries an untagged version and dispatches
#      the Release workflow on it.
#
# Loop protection: chore(release) commits are excluded from the bump
# calculation, the open-release-PR step skips when the release branch
# exists, and step 4 only acts when the version is ahead of the last tag.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-automation
  cancel-in-progress: false

jobs:
  robot:
    name: Release robot
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Approve pending CI runs for release PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          PRS="$(gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("release/")) | .number' || true)"
          if [ -z "$PRS" ]; then
            echo "no open release PRs"
            exit 0
          fi
          for pr in $PRS; do
            BRANCH="$(gh pr view "$pr" --json headRefName --jq '.headRefName')"
            RUNS="$(gh api "repos/$REPO/actions/runs?status=action_required&per_page=100" \
              --jq ".workflow_runs[] | select(.head_branch==\"$BRANCH\") | .id" 2>/dev/null || true)"
            for run in $RUNS; do
              echo "approving run $run for PR #$pr"
              gh api -X POST "repos/$REPO/actions/runs/$run/approve" || true
            done
          done

      - name: Enable auto-merge on open release PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRS="$(gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("release/")) | .number' || true)"
          for pr in $PRS; do
            echo "updating branch and enabling auto-merge on PR #$pr"
            gh pr update-branch "$pr" 2>/dev/null || true
            gh pr merge "$pr" --auto --squash --delete-branch || true
          done

      - name: Open release PR when a bump is pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUTPUT="$(bash scripts/release-bump.sh --dry-run 2>&1 || true)"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q '^new tag:' || { echo "no pending release"; exit 0; }
          NEW_TAG="$(echo "$OUTPUT" | grep -oE '^new tag: v[0-9]+\.[0-9]+\.[0-9]+$' | awk '{print $3}')"
          BRANCH="release/${NEW_TAG#v}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "release branch $BRANCH already exists"
            exit 0
          fi
          git config user.name "sddk-release-bot"
          git config user.email "sddk-release-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          bash scripts/release-bump.sh
          git add -A
          git commit -m "chore(release): ${NEW_TAG#v}"
          git push -u origin "$BRANCH"
          BODY_FILE="$(mktemp)"
          printf 'Automated release PR generated by the Release robot.\n\n' > "$BODY_FILE"
          printf -- '- Version bump %s (workspace + 7 crates + manifest.toml + Cargo.lock)\n' "${NEW_TAG#v}" >> "$BODY_FILE"
          printf -- '- CHANGELOG.md updated from conventional commits\n' >> "$BODY_FILE"
          printf -- '- Merge to publish; the robot handles CI approval, merge, tag, and release.\n' >> "$BODY_FILE"
          PR_URL="$(gh pr create --head "$BRANCH" --base main \
            --title "chore(release): ${NEW_TAG#v}" \
            --body-file "$BODY_FILE" 2>&1 || true)"
          rm -f "$BODY_FILE"
          echo "$PR_URL"
          if echo "$PR_URL" | grep -q 'pull/'; then
            PR_NUM="$(echo "$PR_URL" | grep -oE '[0-9]+$')"
            gh pr merge "$PR_NUM" --auto --squash --delete-branch || true
          fi

      - name: Tag and dispatch release when main is ahead of the last tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read the version from origin/main, never from the dirty working
          # tree (the bump step leaves release/ branches checked out).
          VERSION="$(git show origin/main:manifest.toml | grep -m1 '^version = ' | sed -E 's/version = "([^"]+)"/\1/')"
          LAST="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          CURRENT="${LAST#v}"
          echo "manifest version: $VERSION, last tag: $LAST"
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "main version already tagged; nothing to do"
            exit 0
          fi
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists on origin"
            exit 0
          fi
          git config user.name "sddk-release-bot"
          git config user.email "sddk-release-bot@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "pushed tag $TAG"
          # A tag push performed with GITHUB_TOKEN does not emit a push
          # event (GitHub suppresses bot-triggered workflows), so dispatch
          # the Release workflow explicitly on the new tag.
          gh workflow run release.yml --ref "$TAG"
          echo "dispatched Release workflow on $TAG"

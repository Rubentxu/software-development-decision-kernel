name: Clean-Machine UAT

# UAT-1: fresh-machine distribution verification.
# Invokable via: act pull_request -W .github/workflows/clean-machine-uat.yml
# or: act workflow_dispatch -W .github/workflows/clean-machine-uat.yml

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to test (default: latest)"
        required: false
        type: string
        default: latest
  pull_request:
    paths:
      - 'tests/clean_machine_uat.sh'
      - '.github/workflows/clean-machine-uat.yml'
      - 'scripts/install.sh'

permissions:
  contents: read

concurrency:
  group: clean-machine-uat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-machine-uat:
    name: Clean-Machine UAT (UAT-1)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run UAT script
        env:
          SDDK_REPO: ${{ github.repository }}
        run: |
          TAG="${{ inputs.tag || 'latest' }}"
          echo "::group::Running clean-machine UAT for tag: $TAG"
          bash tests/clean_machine_uat.sh --tag "$TAG"
          echo "::endgroup::"

      - name: Upload receipt as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-machine-uat-receipt
          path: .sddk/cycles/p-63676b11dc0ef88f/a5-5-clean-machine-sweep/clean-machine-uat-receipt.json
          retention-days: 90
          if-no-files-found: warn

      - name: Upload install logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clean-machine-uat-logs
          path: |
            /tmp/install.log
            /tmp/rollback_install.log
            /tmp/rollback_doctor.json
          retention-days: 30
          if-no-files-found: ignore

command_or_test: "t_ac10_verify_receipt_marks_observed_static_evidence"
result: PASS
result_ref: "crates/sddk-engine/tests/a6_s3_ac10_verify_integration.rs::t_ac10_verify_receipt_marks_observed_static_evidence"
provider_basis: "AnalysisResult.digest (sha256)"
notes: |
  When the provider emits one `Affirms` and one `Denies` observation
  (the latter triggered by a text starting with `CONTRADICTION:`),
  `StaticProviderDomain::evaluate` produces `Contradicted { reason }`.
  The downstream VerifyReceipt therefore stamps `OBSERVED_STATIC`
  (driven by `EvidenceRef.locator` prefix `cognicode://` and
  `ObservationOrigin::StaticProvider`) — no `EvidenceKind` variant
  added. The canonical contradiction mechanism remains
  `KnowledgeBasis::invalidate(Contradicted, _)`; the
  `CONTRADICTION:` text heuristic is best-effort free-text parsing.


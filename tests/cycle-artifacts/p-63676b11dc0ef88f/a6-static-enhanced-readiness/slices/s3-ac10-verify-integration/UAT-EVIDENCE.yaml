uat_id: AC10
sddk_commit: "<slice S3 closing commit>"
profile: Static
fixture: "FakeCodeIntelligenceProvider + code_intelligence_port_verify_bridge::build(analysis, rev, Some(\"0.97.1\")) -> BridgedObservationSet; StaticProviderDomain on VerifyKernel"
command_or_test: "t_ac10_cognicode_observation_set_bridges_into_verify_kernel"
result: PASS
result_ref: "crates/sddk-engine/tests/a6_s3_ac10_verify_integration.rs::t_ac10_cognicode_observation_set_bridges_into_verify_kernel"
provider_basis: "AnalysisResult.digest (sha256, content-addressed)"
notes: |
  Round-trip end-to-end: a CogniCode-shaped `AnalysisResult` flows
  through the bridge into a Verify-consumable
  `observation::ObservationSet`. The `SoftwareObservation`s carry
  `ObservationOrigin::StaticProvider`, `EvidenceRef{ kind=Adhoc,
  locator='cognicode://<unit>' }`, and `subject =
  ObservationSubject::Unit(SoftwareUnitRef)` whose `canonical_tag()`
  is `unit:<locator>`. `StaticProviderDomain` matches the
  `VerificationClaim::subject_tag` against `obs.subject.canonical_tag()`
  (see `crates/sddk-engine/src/verify_kernel/adapter_static_provider.rs`
  lines 70+). With `subject_tag = "unit:crates/sddk-cli/src/main.rs"`
  the match is exact and the kernel produces `Verified` (single
  `Affirms` observation present) or `Contradicted` (mixed Affirms+Denies),
  never `Unknown`. The bridge is a pure translator: no DTO from
  `code_intelligence_port` crosses into `observation`; only the typed
  ADTs that already lived there.


bug_documented_in_slice:
  - `Engine::verify_cycle_snapshot` rejects replans whose manifest was
    updated by `cycle_replan` because the replay re-derivation does
    not re-apply the manifest-level `replan_count` increment. AIW-S4
    avoids `verify_cycle_snapshot` in `w03` and uses `get_cycle`
    directly. Documented in RECEIPT §2.3 D1.

# pytest config baseline.
# Drop into pyproject.toml under [tool.pytest.ini_options] or into pytest.ini.

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "tests.py"]
python_functions = ["test_*"]
addopts = [
  "-ra",          # summary of all fails/errors
  "--strict-markers",
  "--strict-config",
  "--showlocals", # show local variables in tracebacks
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration (require real infra)",
  "e2e: marks tests as end-to-end",
]
filterwarnings = [
  "error",        # treat warnings as errors
  # Allow specific warnings as needed
  # "ignore::DeprecationWarning:module.submodule",
]

# Async support (if using pytest-asyncio)
# asyncio_mode = "auto"

# Esquema de research/agenda.yml

required_fields:
  - agenda.topic
  - agenda.domain
  - agenda.questions
  - agenda.questions[].id
  - agenda.questions[].question
  - agenda.questions[].claim_type
  - agenda.questions[].evidence_level
  - agenda.questions[].risk

schema:
  agenda:
    topic: string
    domain: enum [technology, ai-ml, systems-thinking, science, medicine, economics, history, philosophy, other]
    questions:
      - id: string  # RQ-{kebab-slug}
        question: string
        claim_type: string  # depende del dominio (ver references/claim-types.md)
        evidence_level: enum [L1, L2, L3, L4, L5, L6, L7, L1-exp]
        risk: enum [critical, normal, low]
        admissible_sources: [string]  # ej [official-docs, source-code, peer-reviewed]
        status: enum [open, investigating, resolved, disputed, deprecated]
        claim_id: string  # si ya está en el corpus
        notes: string  # opcional
    gaps:
      - string  # frases de conocimiento faltante
    strategy:
      default_authority_floor: enum [L1, L2, L3, L4, L5]
      hard_blockers: [enum]
      experimental_validation_required: bool  # para claims de performance/behavior

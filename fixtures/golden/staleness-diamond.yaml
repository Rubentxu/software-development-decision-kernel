name: staleness-diamond
events:
- event_type: test.verifies
  subjects:
  - - test
    - t1
  - - requirement
    - r1
  cycle_id: c-1
- event_type: test.verifies
  subjects:
  - - test
    - t2
  - - requirement
    - r1
  cycle_id: c-1
- event_type: requirement.modified
  subjects:
  - - requirement
    - r1
  cycle_id: c-1
expect:
  nodes: 4
  edges: 3
  node_keys:
  - requirement:r1
  - test:t1
  - test:t2
  edges_match:
  - from: test:t1
    relation: test.verifies
    to: requirement:r1
  - from: test:t2
    relation: test.verifies
    to: requirement:r1
  - from: requirement:r1
    relation: requirement.modified
    to: requirement:r1

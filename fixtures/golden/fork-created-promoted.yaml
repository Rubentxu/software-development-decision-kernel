name: fork-created-promoted
events:
- event_type: fork.created
  subjects:
  - - fork
    - f1
  - - cycle
    - c-1
  cycle_id: c-1
- event_type: fork.promoted
  subjects:
  - - fork
    - f1
  cycle_id: c-1
expect:
  nodes: 2
  edges: 2
  node_keys:
  - cycle:c-1
  - fork:f1
  edges_match:
  - from: fork:f1
    relation: fork.created
    to: cycle:c-1
  - from: fork:f1
    relation: fork.promoted
    to: fork:f1

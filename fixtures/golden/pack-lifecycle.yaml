name: pack-lifecycle
events:
- event_type: pack.installed
  subjects:
  - - pack
    - p1
  cycle_id: c-1
- event_type: pack.enabled
  subjects:
  - - pack
    - p1
  cycle_id: c-1
- event_type: pack.disabled
  subjects:
  - - pack
    - p1
  cycle_id: c-1
expect:
  nodes: 2
  edges: 3
  node_keys:
  - pack:p1
  edges_match:
  - from: pack:p1
    relation: pack.installed
    to: pack:p1
  - from: pack:p1
    relation: pack.enabled
    to: pack:p1
  - from: pack:p1
    relation: pack.disabled
    to: pack:p1

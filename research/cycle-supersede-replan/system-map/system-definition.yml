## Open questions for R1

1. **Cycle vs hypothesis** (insight #6): Is there a domain primitive that already separates goal from decision in `sddk-domain`? If yes, leverage it. If no, propose `DesignDecision` as a first-class event.
2. **Replan-in-place authority** (insight #3): Who can invoke it? Orchestrator only, or human via `sddk` CLI? What's the boundary?
3. **Writer XDG fail-closed** (insight #5): Is the failure-closed path already enforced for vault artifacts? Where else does a writer need it (UAT, knowledge, etc.)?
4. **Gate taxonomy** (insight #2): Which of the 5 budget gates from Wave 1 are security vs process? Map them.
5. **Complexity budget** (insight #7): What is the per-cycle gate budget? Where is it observable?
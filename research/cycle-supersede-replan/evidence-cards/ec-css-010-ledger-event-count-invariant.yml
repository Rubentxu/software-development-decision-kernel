# Evidence Card — Ledger event count is the binding invariant

## Card ID

EC-CSS-010

## Claim (verbatim)

> "Recover (`sddk recover <cycle>`) is replay-only relative to the canonical
> ledger: digest and event count must remain byte-identical. Any new
> operation (`cycle.supersede`, `cycle.replan`) inherits this invariant:
> dry-run and rollback preserve canonical events."


2027-02-28.

## Confidence

corroborated (0.80).

## Triangulation verdict

2 L1 sources + 1 documented gap. The gap is documentary, not substance.

## What this card supports

- ADR-F (complexity budget policy).
- SPEC-COMPLEXITY-BUDGET-001.

## Decay warning

Re-verify when `metrics.rs` schema changes or when Wave plan adds new gates.

## Anti-tautology check

Removing metrics does NOT make this card fail — the card claims absence of a
budget policy, not absence of measurement.
# Evidence Card — Gate cost is observable but not budgeted

## Card ID

EC-CSS-006

## Claim (verbatim)

> "The CLI exposes per-cycle metrics (Levels A-E + L1-L6 costs) in
> `crates/sddk-cli/src/metrics.rs`, but no published policy budgets a
> per-cycle gate cost. The 5 Wave-1 budget gates therefore have no
> observable complexity ceiling — drift toward 'more gates = more safety'
> is unmeasured."

## Evidence

| # | Source | Path / Symbol | Tier |
|---|---|---|---|
| 1 | L1.S19 | `crates/sddk-cli/src/metrics.rs` (Levels A-E + L1-L6 — referenced by L1.S8 but not directly inspected) | L1 |
| 2 | L1.S8 | `docs/sddk-decision-kernel-architecture/02-roadmap/ROADMAP.md` §Wave 1.5 (5 budget gates enumerated; no cost ceiling) | L1 |
| 3 | GAP-5 | `crates/sddk-cli/src/metrics.rs` Levels A-E + L1-L6 not directly inspected in this research | (gap) |


## Conflicting signals detected at R3

1. **`vault_cmd.rs` references ADR-0078 (line 172) but ADR-0078 does not
   exist in `docs/adr/` or `docs/sddk-decision-kernel-architecture/03-adrs/`.**
   - Conflict: code claim "verbatim `{VAULT003}` per ADR-0078" vs absence.
   - Resolution: ADR-0078 is missing; the substantive claim (allow-list = 1
     entry, code = VAULT003) is independently verifiable in
     `crates/sddk-vault/src/repair.rs:16`. The ADR number is decorative.
   - R6 action: emit evidence card "ADR-0078 reference is dangling;
     substance stands in repair.rs". Suggest creating ADR-0078 retroactively
     to bind the authority.
2. **AGENTS.md §8 vs `crates/sddk-cli/src/cycle.rs:843-886`** (lock acquire
   vs FOREIGN KEY constraint). Both are L1; conflict is functional not
   documentation. Not in scope for this research; flagged for cycle-47+.
3. **Last HANDOFF (cycle-43, v1.48.10) vs HEAD (v1.65.7)**: 17 release
   versions without intermediate HANDOFFs. Conflict is documentary gap, not
   code disagreement. Flagged in `gaps.yml`.

## Decay enforcement

All sources have a `decay` field in `candidate-pool.yml`. Sources older
than `decay` are marked `needs_review` and must be re-verified before
any future citation.

## Acceptance for the proposal

A claim may be carried into R4 triangulation iff:

- It has ≥ 1 L1 source, OR
- It has ≥ 2 L2/L3 sources, OR
- It has 1 L2/L3 source AND 1 external source (L1 standards only).

All claims in this research meet the L1-primary threshold.
# R3 — Source Credibility Assessment

Each source in `candidate-pool.yml` scored on 5 axes:

- **Authority** (1-7): L1 primary code/ADR / L2 authoritative secondary / L3+
  tertiary. Lower is better.
- **Bias**: -2 (clean) .. +2 (project-affirming only).
- **Conflict-of-interest**: -2 (independent) .. +2 (self-citation).
- **Freshness**: date last verified.
- **URL alive / reachable**: yes/no.


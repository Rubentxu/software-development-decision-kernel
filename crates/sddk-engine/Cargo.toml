[package]
name = "sddk-engine"
version.workspace = true
edition = "2024"
authors = ["SDDK Team"]
license = "MIT"
rust-version.workspace = true

[features]
default = []
std = []
# CC-S2: gates `code_intelligence_port_fake` so production builds
# never expose the in-process fake. Downstream consumers who want
# the fake in their own integration tests enable this feature.
# Enabled implicitly for in-crate `cargo test` runs via #[cfg(test)].
test-support = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { workspace = true }
# Real TOML parsing for the version-lockstep rule. The hand-rolled line parser
# this replaces matched table headers with `starts_with("[workspace")`, which
# also matched `[workspace.dependencies]` (INC-DEBT-051 addendum, session-65i,
# RED `left: "9.9.9" / right: "1.42.5"`), and only ever stripped double quotes,
# so `version = '1.2.3'` — valid TOML — aborted the release. Same major
# version sddk-cli already uses.
toml = "0.8"
thiserror = { workspace = true }
sha2 = "0.10"
hmac = { workspace = true }
getrandom = { workspace = true }
dirs = { workspace = true }
regex = { workspace = true }
sddk-domain = { path = "../sddk-domain" }
time = { workspace = true }
uuid = { workspace = true }
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "time", "sync", "net"] }
rand = "0.8"
reqwest = { workspace = true }

[dev-dependencies]
regex = { workspace = true }
tempfile = { workspace = true }
# WHY: adoption.rs `fossilized_capitalized_ledger_row_is_still_the_same_identity`
# must write a `projects` row exactly as a pre-normalization binary did
# (owner in caps). It still uses raw SQL, but NOT because the storage layer
# refuses that row: session-76 gave `register_project_workspace` the SAME
# case-insensitive comparison the engine already had, so the fossilized row
# registers through the normal API now. The raw SQL is here only to
# FABRICATE the pre-normalization state, which is what the test is about.
# Before session-76 this comment said the refusal was "by design" and that the
# guard under test was `inspect_ledger`, not the storage guard — which was a
# workaround wearing a design's clothes, and it is what kept the two layers
# disagreeing: `adopt status` said `complete` while `adopt apply` said conflict
# on the same ledger.
rusqlite = { workspace = true }
# WHY: cycle_authority.rs durability-required tests use file-based Storage::open(&path) reopen pattern
# (REQ-M13-004 anti-AC hygiene — name the durability tests that justify this dev-dep)
sddk-storage = { path = "../sddk-storage" }
# WHY: port_contracts.rs uses InMemoryLedger for byte-equivalence cross-checks
sddk-testkit = { path = "../sddk-testkit" }
# CC-S2: integration tests in `tests/` are compiled as a separate target
# where `cfg(test)` is NOT set in the library crate. Re-importing the
# crate itself with `features = ["test-support"]` makes the
# `code_intelligence_port_fake` module available to those tests.
# This is the canonical Cargo pattern for `pub` test-only APIs.
sddk-engine = { path = ".", features = ["test-support"] }

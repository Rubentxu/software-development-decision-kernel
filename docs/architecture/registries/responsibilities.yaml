    notes: "Locked JSON snapshot of the AgentCommandSurface shipped v1.161.0 (M7.1B, closes A6 from M7.1 archive). current() builds a GoldenSurface (schema_version=1) over the live registry with the locked subset: name + stability + side_effect_class + required_authority + machine schema name + examples_n (body intentionally excluded — walker handles body-level conformance). current_json() is deterministic byte-for-byte. GOLDEN_PATH = tests/fixtures/agent-surface.golden.json. matches_fixture() returns Ok when current_json() == the on-disk fixture; otherwise Err(diff_summary). UPDATE_SNAPSHOTS=1 in the test env rewrites the fixture. State-class Projection: the golden is a derived view, regenerable from the registry without state loss."


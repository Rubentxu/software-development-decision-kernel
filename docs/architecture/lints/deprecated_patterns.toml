# Deprecated patterns registry — M0 D6 (M9 enforcement infrastructure)
#
# Five clippy-style lints that detect use of patterns that the package's
# MIGRATION-AND-DEPRECATION.md marks for evolution or removal in M1-M9.
#
# The TOML schema was extended in v1.168.8 (post-M9 INC hygiene) with
# machine-readable `pattern` (regex) + `paths` (glob list) fields so
# `sddk dev lint deprecated-patterns` can execute the lints against the
# live workspace. The original `detection` prose remains for human
# auditors.
#
# Status (v1.168.8): all 5 lints execute and report hits; **all stay at
# `default: allow`** (advisory). Promoting any to `default: deny` (blocking)
# requires per-lint validation against the live workspace baseline:
#   - The pattern must be ONLY present in legacy/deprecated code paths.
#   - Migration to the replacement must be complete (no orphan uses).
#   - RISK-REGISTER R-001 user sign-off must be collected.
# The M9 row in `docs/architecture/README.md` flags this follow-up
# explicitly as a gap between "delivered infrastructure" and "enforced
# policy" — see v1.168.8 changelog for the honest disclosure.

schema_version = "v1"
generated_at = "2026-09-09T14:26:00Z"
cycle = "p-63676b11dc0ef88f/m0-inventory-baseline"
last_extended_at = "2026-09-12T08:44:00Z"
enforcement_status = "agent_result_used: deny (M9.1, v1.168.12); asset_deprecated_namespace/asset_raw_store_reference/asset_authority_language: deny (v1.168.29, ARCH-LINT-AX-S5 promotion); remaining: advisory — replacement ADRs (ADR-0100/0101) still proposed or first-letter regex unsafe-by-design"

[[lints]]
id = "agent_result_used"
severity = "warn"
default = "deny"
category = "deprecated_patterns"
description = """
Use of `AgentResult` (legacy aggregate) where the canonical `Contribution`
+ `ExecutionOutcome` split applies (per ADR-0101 / SPEC-007).
"""
detection = """
Find references to `AgentResult` (the legacy aggregate type, NOT the
CLI command `Command::AgentResult` for converting legacy output) in
`crates/sddk-engine/src/**/*.rs` and `crates/sddk-cli/src/**/*.rs`.
Report location, not auto-fix.
"""
pattern = "\\bAgentResult\\b"
paths = [
    "crates/sddk-engine/src/**/*.rs",
    "crates/sddk-cli/src/**/*.rs",
]
# The CLI command name `Command::AgentResult` is the converter entry
# point, not a use of the legacy aggregate. False positive without
# this exclusion (see crates/sddk-cli/src/lib.rs:256). Schema / result
# command wiring is about exposing the legacy form intentionally during
# the migration window.
exclude_paths = [
    "crates/sddk-cli/src/lib.rs",
    "crates/sddk-cli/src/result_cmd.rs",
    # Spike SP-06 is a retrieval-evaluation knowledge corpus: it cites the
    # legacy name *because* recovery questions ask about the deprecation.
    # Citations there are intentional content, not production uses.
    "crates/sddk-engine/src/spike_sp06.rs",
]
replacement = [
    "Use `Contribution` + `ExecutionOutcome` from crates/sddk-engine/src/agent_contribution_envelope.rs",
    "See ARCH-SPEC-007 in docs/architecture/specs/arch-spec-007-agent-protocol-and-handoff.md",
]
reference_adrs = ["ADR-0101"]
milestone_introduced = "M0"
milestone_enforces = "M9"
confidence = "high"

[[lints]]
id = "evidence_kind_v1"
severity = "warn"
default = "allow"
category = "deprecated_patterns"
description = """
Use of `PlanningEvidenceKind` (legacy enum) where the universal Evidence
model + relation/fact split applies (per ADR-0100 / SPEC-001).
"""
detection = """
Find references to `PlanningEvidenceKind` in `crates/sddk-domain/src/**/*.rs`
and `crates/sddk-engine/src/**/*.rs`.
"""
pattern = "\\bPlanningEvidenceKind\\b"
paths = [

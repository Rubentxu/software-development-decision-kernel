[acceptance_for_m9_blocking_enforcement]
validation_per_lint = "For each of the 5 lints, confirm that all current hits in the workspace are in legacy/deprecated code paths (no false positives on production code). Document the audit per-lint."
migration_completion = "For each lint, the replacement path must be fully wired and tested (e.g. `Contribution` + `ExecutionOutcome` must be the only canonical way to emit agent output, with no remaining legacy `AgentResult` writes)."
user_signoff = "RISK-REGISTER R-001: user sign-off must be collected before flipping any lint from `default: allow` to `default: deny`."


    # E2: enum definition + relation_tag decoder + from_universal_relation
    # derive + variant pin tests. The type survives READ-only for legacy rows.
    "crates/sddk-domain/src/planning/mod.rs",
    # E3: public re-export kept for compat decoding consumers.
    "crates/sddk-domain/src/lib.rs",
    # Canonical ADR-0100 mapping module: planning_evidence_relation +

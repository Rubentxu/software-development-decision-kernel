Find references to `PlanningEvidenceKind` in production sources of all
workflow crates (`crates/sddk-domain/src`, `crates/sddk-engine/src`,
`crates/sddk-storage/src`, `crates/sddk-cli/src`), excluding the closed
compat set: the enum definition module (planning/mod.rs), its re-export
surface (sddk-domain lib.rs), the canonical mapping module
(evidence_relation_mapping.rs), the spine-import read decoder
(comment-only in semantic_kind.rs and the SP-06 corpus) and the
retrieval corpus (spike_sp06.rs). Any NEW reference — i.e. any new
evidence authority or constructor — fails the build naming the call site.
"""
pattern = "\\bPlanningEvidenceKind\\b"
paths = [
    "crates/sddk-domain/src/**/*.rs",
    "crates/sddk-engine/src/**/*.rs",
    "crates/sddk-storage/src/**/*.rs",
    "crates/sddk-cli/src/**/*.rs",

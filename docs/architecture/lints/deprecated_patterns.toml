[[lints]]
id = "orchestration_synthesis_no_dissent"
severity = "warn"
default = "allow"
category = "deprecated_patterns"
description = """
Construction of `OrchestrationSynthesisReceipt` without a Dissent entry
when contributions disagree (per ADR-0101 / SPEC-007).
"""
detection = """
Find call sites of `OrchestrationSynthesisReceipt::new` (5-arg form:
run_id, decision_id, journal_id, coordinator, max_in_flight) and
check whether the caller subsequently populates `set_dissent(...)`
before `put(...)` (warning when no dissent is set on conflicting
contributions). v1.168.8 MVP only counts `OrchestrationSynthesisReceipt::new`
call sites; the dissent-population analysis is a follow-up.
"""
pattern = "OrchestrationSynthesisReceipt::new\\s*\\("
paths = ["crates/**/*.rs"]
# SPEC files reference the constructor by name in documentation.
exclude_paths = ["docs/**"]
replacement = [
    "Always populate Dissent when contribution conflicts exist",
    "See crates/sddk-engine/src/orchestration_synthesis.rs",
]
reference_adrs = ["ADR-0101"]
milestone_introduced = "M0"
milestone_enforces = "M9"
explanation = """
Hits: 19 (1 in crates/sddk-engine/src/orchestration_synthesis.rs:745, 18 in crates/sddk-engine/tests/orchestration_synthesis_tests.rs).
Verdict: blocked_on_audit
Reason: the lint runner's MVP detection counts `OrchestrationSynthesisReceipt::new` call sites only — it does NOT audit whether the caller subsequently populates `set_dissent(...)` before `put(...)`. The 19 hits are split between 1 production caller and 18 test fixtures, all of which legitimately construct the receipt (tests assert no-dissent and dissent-populated paths both work). Promoting to `deny` would block the dissent-populated tests.
Unblock: extend the runner to walk from each `::new(...)` call site to the next `set_dissent`/`put` and emit a hit only when the receipt is `put`-en without dissent on conflicting contributions. Track as cycle-7 (`p-63676b11dc0ef88f/synthesis-dissent-runner-extension`). ADR-0101 is already accepted (v1.168.32); the gate is runner extension, not ADR promotion.
"""
confidence = "medium"

[[lints]]
id = "execution_outcome_as_synthesis"
severity = "warn"
default = "allow"
category = "deprecated_patterns"
description = """
Use of `ExecutionOutcome` as a drop-in replacement for synthesis
(per package's MIGRATION-AND-DEPRECATION.md: ExecutionOutcome +
Contribution are distinct).
"""
detection = """
Find struct-literal constructions of `ExecutionOutcome` (heuristic:
`ExecutionOutcome {` followed within a few lines by `decisions:` /
`evidence:` / `dissent:`) that should live in
`OrchestrationSynthesisReceipt`. v1.168.8 MVP only locates the
pattern; the synthesis-field heuristic is a follow-up.
"""
pattern = "ExecutionOutcome\\s*\\{"
paths = ["crates/**/*.rs"]
exclude_paths = []
replacement = [
    "Separate ExecutionOutcome (raw provider output) from OrchestrationSynthesisReceipt (consumed contributions + dissent)",
]
reference_adrs = ["ADR-0101"]
milestone_introduced = "M0"
milestone_enforces = "M9"
explanation = """
Hits: 0 (no struct-literal `ExecutionOutcome {` constructions found in any crate at v1.168.33 baseline).
Verdict: blocked_on_audit
Reason: heuristic is medium-confidence; the regex `ExecutionOutcome\\s*\\{` matches struct literals but `ExecutionOutcome` is also returned by name in `match` arms, printed via `{outcome:?}`, and exposed in test fixtures. Promoting to `deny` on a medium-confidence heuristic would create false-positive risk on any future code that uses `ExecutionOutcome` legitimately as a return type or match target. The 0-hit baseline is the right reason to keep this lint advisory: there is no current production misuse to block.
Unblock: re-audit against a larger corpus (e.g. AX-S6 2nd provider arrival) and re-evaluate `confidence`. If hits remain 0 and the usage surface grows, promote to `deny` with a narrower regex that excludes `match` arms and `Debug` formatting. No cycle is scheduled for this expansion; it follows organic usage growth.
"""
confidence = "medium"

[[lints]]
id = "transition_outcome_used"
severity = "warn"
default = "allow"
category = "deprecated_patterns"
description = """
Use of `TransitionOutcome` (legacy partial shape of ExecutionOutcome)
where the canonical `ExecutionOutcome` applies.
"""
detection = """
Find references to `TransitionOutcome` in engine/runtime modules
and verify migration to `ExecutionOutcome`.
"""
pattern = "\\bTransitionOutcome\\b"
paths = [
    "crates/sddk-engine/src/**/*.rs",
    "crates/sddk-cli/src/**/*.rs",
]
exclude_paths = []
replacement = [
    "Use ExecutionOutcome per arch-spec-013-agent-experience-contract.md (M7)",
]
reference_adrs = ["ADR-0101", "ADR-0096"]
milestone_introduced = "M0"
milestone_enforces = "M9"
confidence = "high"
explanation = """
Hits: 24 (definition at crates/sddk-engine/src/lib.rs:634; consumers in crates/sddk-cli/src/cycle.rs and crates/sddk-engine/src/event_bus/).
Verdict: blocked_on_audit
Reason: the lint description claims `TransitionOutcome` is "legacy partial shape of ExecutionOutcome" — this is INCORRECT. `TransitionOutcome` (Succeeded/Failed) is the gate-evaluation outcome for declared cycle transitions; `ExecutionOutcome` is the provider raw-output aggregation for agent contributions. They are ORTHOGONAL types with no shared lineage. Production code that uses `TransitionOutcome` is NOT legacy code that should be migrated to `ExecutionOutcome`. Promoting to `deny` would block legitimate cycle-state machinery.
Unblock: description rewrite (this cycle's ARCH-LINT-M9.2 audit already corrects it inline in this `explanation` block) + re-categorization as `category = "state_machine"` (not `deprecated_patterns`). Track as a follow-up to this cycle in the next archive manifest. No construction work is required; the audit conclusion is already in this registry.
"""


[[lints]]
id = "asset_deprecated_namespace"
severity = "warn"
default = "deny"
category = "agent_assets"
description = """
Legacy namespace spelling in agent-facing assets. AGENTS.md 2.0 normalizes
"SDD-kernel" to SDDK; agent/prose assets must use the active surface.
"""
detection = """
Regex line scan over Markdown assets under agents/ and prompts/.
"""
pattern = "SDD-kernel|sddk-kernel"
paths = [
    "agents/**/*.md",
    "prompts/**/*.md",
]
replacement = ["Use the active namespace name `SDDK` (AGENTS.md section 2.0)"]
reference_adrs = []
milestone_introduced = "AX-S5"
milestone_enforces = ""
confidence = "high"

[[lints]]
id = "asset_raw_store_reference"
severity = "warn"
default = "deny"
category = "agent_assets"
description = """
Raw store/table reference in agent-facing prose. Agents reason over typed
contracts and projections; prose that points at SQL or store internals
breaks the vault/runtime separation (semantic ownership, SPEC-002).
"""
detection = """
Regex line scan over Markdown assets under agents/ and prompts/.
"""
pattern = "INSERT INTO|SELECT \\* FROM|CREATE TABLE|sqlite://"
paths = [
    "agents/**/*.md",
    "prompts/**/*.md",
]
replacement = [
    "Reference the typed contract or projection instead of store internals",
]
reference_adrs = []
milestone_introduced = "AX-S5"
milestone_enforces = ""
confidence = "high"

[[lints]]
id = "asset_authority_language"
severity = "warn"
default = "deny"
category = "agent_assets"
description = """
Capability-bypassing authority language. Prose cannot grant side-effect
permissions; capabilities gate them (SPEC-013..018). Phrases that instruct
an agent to bypass invariants or skip verification are contract violations.
"""
detection = """
Case-insensitive regex line scan over Markdown assets under agents/ and prompts/.
"""
pattern = "(?i)you are authorized to bypass|ignore the invariant|skip verification|override the kernel invariant"
paths = [
    "agents/**/*.md",
    "prompts/**/*.md",
]
replacement = [
    "State the requirement through the capability/skill model, not bypass language",
]
reference_adrs = []
milestone_introduced = "AX-S5"
milestone_enforces = ""
confidence = "high"

[[lints]]
id = "asset_unregistered_cli_example"
severity = "warn"
default = "allow"
category = "agent_assets"
description = """
`sddk <cmd>` example whose command is not in the canonical surface
(single source: crates/sddk-cli/src/command_spec.rs, clap-pinned since
AX-S1). Stale command examples in agent assets mislead executors.
"""
detection = """
Regex line scan for `sddk <word>` over Markdown assets where the word
starts with a letter unused by any registered top-level command (the
regex engine has no lookahead; first-letter sieve + confidence: medium).
Full-surface validation stays in the command_spec clap guard.

ARCH-LINT-AX-S5 audit (v1.168.29): this lint stays `default: allow`
because its first-letter-sieve regex has documented false-positive
risk against legitimate commands that share a first letter with the
sieve alphabet (e.g. `sddk memory`, `sddk metrics`, `sddk status`,
`sddk ship`, `sddk fork`, `sddk stale`, `sddk explore` — all real
commands in the current CLI surface). The current corpus has 0 hits,
but the regex is unsafe-by-design; promoting to `deny` would
guarantee false positives on any future asset that legitimately uses
`sddk memory` etc. Full-surface validation stays the responsibility
of `live_registry_command_specs_are_in_sync` (AX-S1 pin) which checks
every example against the actual clap surface.
"""
pattern = "sddk +[befjmnosqwxz]"
paths = [
    "agents/**/*.md",
    "prompts/**/*.md",
]
replacement = [
    "Use a registered command (see `sddk agent-help` / command_spec.rs)",
]
reference_adrs = []
milestone_introduced = "AX-S5"
milestone_enforces = ""
confidence = "medium"


# Deprecated patterns registry — M0 D6 (M9 enforcement infrastructure)
#
# Five clippy-style lints that detect use of patterns that the package's
# MIGRATION-AND-DEPRECATION.md marks for evolution or removal in M1-M9.
#
# The TOML schema was extended in v1.168.8 (post-M9 INC hygiene) with
# machine-readable `pattern` (regex) + `paths` (glob list) fields so
# `sddk dev lint deprecated-patterns` can execute the lints against the
# live workspace. The original `detection` prose remains for human
# auditors.
#
# Status (v1.168.8): all 5 lints execute and report hits; **all stay at
# `default: allow`** (advisory). Promoting any to `default: deny` (blocking)
# requires per-lint validation against the live workspace baseline:
#   - The pattern must be ONLY present in legacy/deprecated code paths.
#   - Migration to the replacement must be complete (no orphan uses).
#   - RISK-REGISTER R-001 user sign-off must be collected.
# The M9 row in `docs/architecture/README.md` flags this follow-up
# explicitly as a gap between "delivered infrastructure" and "enforced
# policy" — see v1.168.8 changelog for the honest disclosure.


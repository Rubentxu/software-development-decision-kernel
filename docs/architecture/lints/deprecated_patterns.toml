[[lints]]
id = "agent_result_used"
severity = "warn"
default = "deny"
category = "deprecated_patterns"
description = """
Use of `AgentResult` (legacy aggregate) where the canonical `Contribution`
+ `ExecutionOutcome` split applies (per ADR-0101 / SPEC-007).
"""
detection = """
Find references to `AgentResult` (the legacy aggregate type, NOT the
CLI command `Command::AgentResult` for converting legacy output) in
`crates/sddk-engine/src/**/*.rs` and `crates/sddk-cli/src/**/*.rs`.
Report location, not auto-fix.
"""
pattern = "\\bAgentResult\\b"
paths = [
    "crates/sddk-engine/src/**/*.rs",
    "crates/sddk-cli/src/**/*.rs",
]
# The CLI command name `Command::AgentResult` is the converter entry
# point, not a use of the legacy aggregate. False positive without
# this exclusion (see crates/sddk-cli/src/lib.rs:256). Schema / result
# command wiring is about exposing the legacy form intentionally during
# the migration window.
exclude_paths = [
    "crates/sddk-cli/src/lib.rs",
    "crates/sddk-cli/src/result_cmd.rs",
    # Spike SP-06 is a retrieval-evaluation knowledge corpus: it cites the
    # legacy name *because* recovery questions ask about the deprecation.
    # Citations there are intentional content, not production uses.
    "crates/sddk-engine/src/spike_sp06.rs",
]
replacement = [
    "Use `Contribution` + `ExecutionOutcome` from crates/sddk-engine/src/agent_contribution_envelope.rs",
    "See ARCH-SPEC-007 in docs/architecture/specs/arch-spec-007-agent-protocol-and-handoff.md",
]
reference_adrs = ["ADR-0101"]
milestone_introduced = "M0"
milestone_enforces = "M9"
confidence = "high"


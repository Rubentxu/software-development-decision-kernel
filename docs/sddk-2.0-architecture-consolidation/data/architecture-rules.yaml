schema_version: "1.2.0"
rules:
  - id: ARCH001
    severity: error
    rule: engine_must_not_depend_on_storage
    target: dependency_graph
    desired_state: sddk-engine/application logic depends only on inward ports
  - id: ARCH002
    severity: error
    rule: domain_must_not_depend_on_adapters
    target: dependency_graph
  - id: ARCH003
    severity: error
    rule: cli_must_not_own_persistence_logic
    target: source_imports_and_calls
  - id: ARCH004
    severity: error
    rule: packs_must_declare_dependencies
    target: pack_manifest
  - id: ARCH005
    severity: error
    rule: reactive_behaviors_must_not_execute_governed_effects_directly
    target: capability_imports
  - id: ARCH006
    severity: error
    rule: graph_projection_must_not_depend_on_engine
    target: dependency_graph
    desired_state: sddk-domain/graph module depends only on inward ports
  - id: ARCH007
    severity: error
    rule: domain_types_must_not_import_storage
    target: source_imports_and_calls
  - id: ARCH008
    severity: error
    rule: sdd_agnostic_kernel_runtime
    target: source_imports_and_calls
    desired_state: Workflow runtime modules cannot depend on SDD phase taxonomy
    scope:
      - "**/sddk-domain/src/workflow_ir.rs"
      - "**/sddk-domain/src/workflow_run.rs"
      - "**/sddk-engine/src/lib.rs"
      - "**/sddk-engine/src/operator.rs"
      - "**/sddk-engine/src/workflow_runtime.rs"
      - "**/sddk-engine/src/task_executor.rs"
      - "**/sddk-engine/src/tasks/*.rs"
      - "**/sddk-engine/src/retry.rs"
  - id: ARCH009
    severity: error
    rule: storage_must_not_import_engine
    target: dependency_graph
  - id: ARCH010
    severity: error
    rule: cli_must_not_import_storage_directly
    target: source_imports_and_calls
  - id: ARCH011
    severity: error
    rule: vault_must_not_import_storage
    target: dependency_graph
  - id: ARCH012
    severity: error
    rule: testkit_must_not_import_storage
    target: dependency_graph
  - id: ARCH013
    severity: error
    rule: dynamic_operators_require_capability_contract
    target: source_imports_and_calls
  - id: ARCH014
    severity: error
    rule: expansion_proposals_require_approval_receipt
    target: source_imports_and_calls
  - id: ARCH015
    severity: error
    rule: ir_events_must_not_emit_phase_strings
    target: source_imports_and_calls
waivers:
  - id: WV-0015-ARCH003-composition-root
    rule_id: ARCH003
    reason: "Two composition-root edges in sddk-cli survive the cli-depersistence cycle (SDDK2-103): (a) use sddk_storage::SqliteControlPlane in lib.rs compose() to construct the adapter injected into Box<dyn ControlPlane>, (b) pub use sddk_storage::Storage re-export to satisfy Engine<Storage> wiring without leaking the concrete type into every CLI module. The downcast fallback in failure_envelope is also covered so error envelopes stay actionable while Storage inherent methods still return the concrete StorageError type. See docs/adr/ADR-0015-arch003-composition-root-waiver.md."
    granted_until_sha: 522e5b95bad8e3d89ca053a3aaf27a9b63f2229f
    granted_by: orchestrator + sddk-apply
    granted_at: '2026-08-17T11:05:00Z'
  - id: WV-0026-ARCH008-legacy-compat-seam
    rule_id: ARCH008
    reason: >-
      Legacy compat seam: crates/sddk-domain/src/workflow.rs and
      crates/sddk-engine/src/event_bus.rs:96-117 (emit_phase_event) intentionally
      reference Phase/CyclePath enums and emit workflow.phase.entered/exited
      strings. Removal scheduled for v1.31.0 (cycle 3 — kernel-dynamic-operators)
      when sddk-packs-sdd owns its compilation and IR events fully replace legacy emitters.
    scope:
      ARCH008:
        - "**/sddk-domain/src/workflow.rs"
        - "**/sddk-engine/src/event_bus.rs"
    granted_until_sha: "9999999999999999999999999999999999999999"
    granted_by: orchestrator + sddk-apply
    granted_at: '2026-08-19T00:00:00Z'
  - id: WV-0027-ARCH008-kernel-internal-phase
    rule_id: ARCH008
    reason: >-
      Cycle 2 introduced `compiler.rs` and `validator.rs` (kernel-legacy-sdd-compiler)
      that legitimately use the SDD-agnostic `Phase` enum (workflow_ir.rs::Phase) to
      translate legacy `WorkflowManifest` phases into kernel capabilities. ARCH008's
      regex `\bPhase::` cannot distinguish kernel-internal `Phase::Explore` from
      legacy SDD `Phase::Variant`, so both files are exempted. Re-evaluate at v1.33.0
      when the kernel Phase enum is fully separated from any legacy semantics.
    scope:
      ARCH008:
        - "**/sddk-domain/src/compiler.rs"
        - "**/sddk-domain/src/validator.rs"
    granted_until_sha: "9999999999999999999999999999999999999999"
    granted_by: orchestrator + sddk-apply
    granted_at: '2026-08-19T19:00:00Z'

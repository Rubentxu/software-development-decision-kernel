  development_head: 'GATES_QUE_responden_sin_examinar_nada_SESSION-65d: DOS defectos del MISMO genero encontrados el mismo dia, y el segundo por un actor distinto del primero. (A) ddfd2b51 (otro actor, ya publicado) corrigio INC-DEBT-053: `ledger verify-chain` resolvia por defecto el stream `project:<id>`, que no existe en ninguno de los 326 ledgers de la maquina, contestaba PASS sobre cero eventos; `debt report`/`gates` fabricaban un informe para un ciclo ajeno sin hallazgos, luego los gates `debt-severity-assigned` y `debt-priority-assigned` eran CONSTANTES. Evaluado: 865 tests del lib verdes, clippy limpio, INC-DEBT-053 bien escrito. PERO le encontre un defecto que sus dos tests no podian alcanzar: `verify_streams` reconstruia la etiqueta con `resolve_streams(None, ..)`, luego `verify-chain --stream X` contestaba `stream: all streams of <project>`. RED medido (left all streams of p-demo / right cycle:p-demo/one), corregido en d76cbb1c haciendo que la etiqueta viaje desde quien la decide hasta quien la publica, con su test. (B) MIO: `doctor --strict` salia con exit 0 SIN MEDIR NADA. Los checks de brevedad se anclaban a `current_dir()` con cada enumeracion dentro de `if let Ok(read_dir(..))`, y `resolve_active_framework_root` ignora el cwd, luego el caso normal (auditar un prefijo instalado desde el directorio de uno mismo) es un cwd sin superficies. Medido sobre el binario publicado v2.5.2: 0 checks emitidos, all_present true, exit 0. Y NINGUN GATE LO EJECUTABA: `grep -rn -- "--strict" .github/` -> 0 coincidencias. Los criterios de ADR-016 siguen vigentes y NO hay waiver, pero su unica aplicacion automatica eran dos tests que montaban una raiz CON superficies, luego ninguno alcanzaba la ruta neutra. Corregido en cfe96856: `has_surface_dirs()` decide si un root puede medirse, se prefiere el cwd y se cae al framework root activo, y sin superficies se falla cerrado nombrando que el presupuesto es INVERIFICABLE y no satisfecho. INC-DEBT-054. Los 19 briefness incumplidores (2 agents, 14 skills, 3 prompts) ya no pueden pasar inadvertidos. (C) Dientes falsificados: los 2 del doctor mueren, cada uno atribuido a su test; el de la etiqueta se observo en rojo antes de corregir. (D) `Cargo.lock` no lo regenero ddfd2b51 al bumpear a 2.5.3, luego declaraba 2.5.2 para los 8 miembros; corregido en 0c512cf6. (E) El gate de cobertura del changelog daba PASS=0 FAIL=3 porque 2.5.3 no tenia seccion; escrita en 9085402b, ahora PASS=6 FAIL=0. (F) CIERRE session-65d: `sddk dev install` llevo la autoridad local a 2.5.3 — hubo que compilarlo antes, porque `dev install` instala el binario que se esta ejecutando y con el 2.5.2 del PATH se habria reinstallado el mismo 2.5.2. El bundle sigue en 2.5.2: `dev install` desde checkout escribe `bundle: false` y el bundle 2.5.3 exige publicar la release. VALIDACION CONTRA EL BINARIO INSTALADO, la que faltaba: el escenario que con v2.5.2 daba 0 checks y exit 0 ahora da (a) raiz del repo 19 violaciones exit 1, (b) cwd sin superficies con bundle resoluble 183 checks emitidos y 19 violaciones exit 1 — el fallback al framework root funciona, (c) cwd sin superficies y sin bundle 1 check surface.briefness.root present=false y exit 1 con detalle ''unverifiable here, not satisfied''. Las 19 coinciden con el recuento independiente hecho antes de tocar nada. CONSECUENCIA ACEPTADA: `--strict` ya puede fallar y va a fallar (19 presupuestos), y la fase verify de todo proyecto deja de poder autorizarse con los dos gates de deuda. Es el aviso que los gates ciegos reprimian; la salida es implementar la deteccion y adelgazar las superficies, no restaurar el PASS constante. BLOQUEO OPERATIVO: solo la autorizacion op-5 (NO el hook, que admite por el segundo disjunct de (A): workspace 2.5.3 > mayor tag publicado v2.5.2). >> RELEASE_V2_5_2_PUBLISHED_SIGNED_AND_CERTIFIED_FROM_PIPELINEK_MIGRATION_25_RECEIPTS_STILL_PENDING_OPERATOR SESSION-65c: (A) v2.5.2 PUBLICADA, FIRMADA Y CERTIFICADA. El bloqueo de session-65/65b (musl-gcc ausente) quedo resuelto por el operador; `release.sh --dry-run` paso los pasos 0-8 con binario estatico real, y el pipeline completo ABORTO en su step 8c con "the project signing identity does not exist on this host" -- es decir, release.sh se niega a publicar sin firma en vez de degradar. Decision del operador: "PipelineK conduce, Actions firma"; el ancla de confianza (SDDK_COSIGN_IDENTITY / SDDK_COSIGN_ISSUER de install.sh) NO se toca. Tag ligero v2.5.2 sobre 818d4ff9 pusheado, `gh workflow run release.yml --ref v2.5.2` -> run 36890390356 success completo. Release: 27 assets, isDraft=false, isPrerelease=false, publishedAt 2026-10-01T16:22:15Z. (B) CERTIFICACION DESDE PIPELINEK: nueva `pipelines/certify-sddk-release.pipeline.kts` (8 etapas) en el harness, commit local fc249b8 SIN pushear (op-5). Al EJECUTARLA aparecieron 8 defectos que leer el fichero no habria encontrado: una etapa NO corre en el workspace (cada una tiene su sandbox, luego un workdir relativo entre etapas no puede funcionar), los raw strings NO se dedentan (un heredoc con la indentacion del .kts nunca cierra y cat sale 0: etapa VERDE escribiendo fichero corrupto), want_id guardaba el comando en vez de ejecutarlo, case comparaba el pin como patron cuando el valor real lleva un backslash delante de yml, pins.env sin comillas perdia los backslashes al hacer source, curl -o recibia la URL como ruta, la etapa de instalacion pedia un scripts/install.sh que el bundle publicado NO contiene, SDDK_BASE_URL con el tag producia una URL doble (404), y SDDK_FRAMEWORK_DIR default iba a SOBRESCRIBIR el bundle runtime del operador. Corregidos los 8, con 28 tests estructurales y 19 mutaciones; las 3 que sobrevivieron la primera ronda (destino de descarga, escape de val, PIN VACIO) eran exactamente la clase de defecto que la etapa existe para cerrar: un pin vacio es cosign diciendo "acepta cualquier firmante". Ejecucion final 8/8 verdes, cosign Verified OK bajo los pins leidos de install.sh, install desde la URL publica, doctor all_present, verdict CERTIFIED. (C) `test_supply_chain_authenticity.sh --tag v2.5.2` = PASS=13 FAIL=0 SKIP=0 con sus 3 controles negativos; addendum en INC-AUDIT-S14-SUPPLY-CHAIN-AUTHENTICITY, que NO cierra nada nuevo (sigue closed desde session-43 con testigo v2.2.27). (D) PUNTERO RECONCILIADO: last_public_release_observed era v2.4.2 y workspace_version_at_current decia DECLARADA-NO-PUBLICA; ambas afirmaciones eran falsas y se corrigen con evidencia observada. HALLAZGO FUERA DE ALCANCE, REPORTADO NO ARREGLADO: certify-candidate.pipeline.kts y promote-release.pipeline.kts del harness tienen el mismo defecto de workdir relativo entre etapas y no pueden completarse; no se tocaron porque no es el bug de ese fichero. PENDIENTE: `sddk dev install` (el binario del PATH sigue en 2.4.2), la migracion de los 25 receipts (apply intacto, digest b98e9a8d, backup verificado, espera autorizacion nueva), RC 0.45.0 de PipelineK (accion externa no autorizada), push del harness (op-5, arrastraria 40 commits). >> SESSION-65: (A) INC-DEBT-051 REGISTRADA (high/P1, open) -- `sddk release plan` y `release apply` NO son utilizables en ningun proyecto que no sea Rust: `ensure_version_lockstep` (crates/sddk-engine/src/version.rs) hardcodea root.join(Cargo.toml) sin consultar adapters. AGENTS.md 2.3 declara la politica agnostica de lenguaje/build/test runner y lista BAZEL -- Gradle y Bazel son el mismo caso, luego es desviacion de un principio declarado, no limitacion legitima. El arreglo es un CONTRATO NUEVO -> SCOPE + ADR. (B) `scripts/migrate_project_identity.py` ERA EL MISMO INC-DEBT-050: su espejo de `normalize_remote_url` reimplementaba el normalizador en Python con reglas PARECIDAS PERO DISTINTAS al Rust (rechazaba git@host:owner/repo, la forma de remote MAS COMUN; trataba el puerto por defecto como global en vez de por esquema; str.isdigit() donde el Rust exige ASCII; aceptaba authority y puerto vacios; crasheaba con UnboundLocalError en IPv6). Un apply con ese espejo habria escrito ids equivocados en ledgers reales. El golden pin de session-64 ya blindaba el camino del remote en Rust; este script era una segunda implementacion sin blindaje.'
  superseded_development_head: "90ec494b  # session-43 00:09Z: AUDITORIA DE VIGENCIA DE DEUDA. De 3 P1 listadas como open, DOS NO ERAN DEUDA REAL. (1) INC-AUDIT-S14 CERRADA (51d3619b, 4531744d, 90ec494b) incluida la parte de distribucion: v2.2.27 verifica con cosign bajo el pin extraido de cosign.rs (PASS=13 FAIL=0), subject real release.yml@refs/tags/v2.2.27. Lo que faltaba no era codigo sino EJECUCION: los tests comprobaban coherencia de pins, nunca que un release publicado verificara. Deuda de proceso vestida de deuda tecnica. De ahi tests/test_supply_chain_authenticity.sh y el PASO 9C de release.sh (autenticidad contra los bytes del CDN de 9b via --assets-dir, fail-closed sin cosign, opt-out explicito). (2) INC-DEBT-034 RECONCILIADA: su documento ya decia closed desde session-33 pero el indice lo listaba open y repetia una divergencia de layout que ya no existe. (3) Entrada DUPLICADA de S14 eliminada del indice (afirmaba que release.sh no firma nada, falso desde session-21). Quedan 3 P1/critical reales de 24. El guard nuevo encontro DOS BUGS EN SI MISMO al ejecutarse: un sed codicioso que devolvia el pin mas el resto de cosign.rs, y un verified 0/2 que reportaba ok. Tercera vez que el falsador encuentra lo que la inspeccion no. GATES: test_release_public_gate 13/0, test_release_admission 24/0, tres mas verdes, shellcheck limpio. NO se ejecuto cargo test: no se toco Rust. CONOCIMIENTO NEGATIVO: la divergencia indice<->documento produjo 2 de las 3 alertas P1 de la sesion. Recibo receipts/session-43/UAT-EVIDENCE-2026-09-30T0007.yaml. Sin cambio en session-43b: sin tocar deuda. >> CONSOLIDADO session-59 (INC-DEBT-046), las 8 claves development_head duplicadas quedaron indexadas aqui: session-57=BLOCKED_MUSL | session-56=PENDING_C3L5 | session-55=PENDING_C3L4 | session-54=PENDING_C3L3 | session-48=fd44a146 | session-46b/c3k=9d5c13d9 | session-46=a14540c5 | session-45=e737b04a. PROSA COMPLETA:  estas ocho entradas eran claves `development_head` DUPLICADAS bajo `source
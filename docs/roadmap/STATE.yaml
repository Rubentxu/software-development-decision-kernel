  superseded_pointer: "8136bbf/2.0.9 (session-22). Flake R-flake-inv10 cerrado en 982014e: el gate `inv10_grep_gate_no_mutex_on_workflow_state` afirmaba `elapsed < 20ms` con hijos triviales, un umbral absoluto sin margen que media la maquina y no el codigo (fallo 4/6 bajo carga, 22-31ms). Subirlo a 200ms lo hacia verde pero dejaba pasar la serializacion completa (max_concurrency=1), o sea que habria dejado de detectar la regresion que existe para detectar; se descarto. Se sustituyo por un RATIO elapsed/coste-serializado, adimensional e independiente de nucleos, velocidad y carga. Los hijos duermen 20ms para que la referencia serializada se calcule en vez de estimarse, y para que el coste fijo de agendar hilos (~2% de 1000ms) no se confunda con contencion del mutex."

  session_69s_bis6: 'C3n.2 MEDIDO. Tabla de exit gate AIW-S0..S8 con veredicto y evidence SHA 43c7aac2, mas una correccion a una afirmacion publicada en ESE MISMO commit. Providers medidos antes de nada: cognicode-mcp PRESENTE, chronos-mcp AUSENTE. S1: POR DEFECTO 2 passed y 3 ignored; con COGNICODE_MCP_BIN y --ignored, 3 passed en 141,60 s. O sea que el producto FUNCIONA contra el provider real, pero cargo test --workspace NO LO CRUZA NUNCA, y uno de los dos tests que corren por defecto es a03_spawn_failure_is_unavailable, que afirma que el provider NO esta disponible. El VERIFIED de la matriz solo es reproducible si alguien exporta una variable y pasa un flag. Es cobertura de sesion, no de pipeline, y los 141,60 s estan medidos para que la decision sea revisable. S4: 7 passed y 12 passed, y NO se promueve: su residual vivo (executed_node_ids es contabilidad de nodos despachados, no evaluacion de operadores) no ha cambiado, y pasar tests no cierra un residual que nadie toco. Es la tentacion que este repo rechaza. S5: BLOCKED CON TIPO, BlockedExternalDependency env_var CHRONOS_MCP_BIN, que por la regla 5 no cuenta como PASS. S7a: 5 passed, se queda IMPLEMENTED. S8: X04 9 passed y X07 6 passed, ambos VERIFIED. CORRECCION, Y ES A UNA AFIRMACION MIA DE 43c7aac2, UN COMMIT ANTES: el parrafo de C3n.1 decia que PROCESS/SQLITE_DURABLE no aparece en ningun otro documento y lo usan exactamente esas 4 filas. ES FALSO: con grep sobre el repo aparece en CINCO SITIOS MAS, uno de ellos en la FUENTE DE PRODUCTO crates/sddk-storage/tests/x04_multi_process_concurrency.rs:17, mas la columna Frontier real de AIW-S8 y los receipts de X04 y X07. LO QUE CAMBIA ES EL DIAGNOSTICO, NO LA FRASE: no es un typo huerfano, es una clasificacion VIVA que la propia regla 3 de la matriz EXCLUYE, porque su vocabulario cerrado declara SQLITE_MULTI_PROCESS y no SQLITE_DURABLE. La reconciliacion de las 4 filas NO cambia; cambia su fuerza, que ya no se sostiene en no existe en ningun otro sitio sino en l
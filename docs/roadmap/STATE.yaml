  session_69b_closed: 'INC-DEBT-059 RESUELTA en dos lotes (07c3fd5c los tests RED, acd790b1 el arreglo, ac44a1b5 la deuda, ff0bacda el changelog). EL ARREGLO: AdoptionPlanInput deja de llevar remote_url + pinned_project_id + scope + fallback_seed y lleva identity: ResolvedProjectIdentity; plan_adoption deja de llamar a resolve_project_identity POR COMPLETO. Es eliminacion y no un campo opcional a proposito: con la identidad ya resuelta derivar por dentro es imposible porque el input ya no tiene de que derivar, luego el punto unico de decision de ADR-0152 queda cierto POR CONSTRUCCION y no por nota. La forma corta (pasar el id resuelto por pinned_project_id) no exige tocar nada y NO FUNCIONA: el engine lo trataria como pin, identity_source no viajaria y alias_origin se perderia un nivel mas adentro, con una forma que PARECE correcta. Y context_cmd.rs ya hacia eso, condicionado a identity_source == Pinned, que es por lo que un checkout con alias y SIN pin era el caso que se rompia: esa condicion se ELIMINA, no se propaga. CUATRO SUPERFICIES por el resolver canonico -- adopt, context bootstrap (que tenia DOS sitios de resolucion), generate docs y el propio engine. LA CUARTA LA ENCONTRO EL FALSIFICADOR, no la lectura: generate docs escribia la documentacion generada bajo el data dir del id RETIRADO mientras project resolve nominaba el superviviente; no salio leyendo el SCOPE ni midiendo el arranque, salio CONTANDO PUNTOS DE LLAMADA con las otras tres ya arregladas. Es la cuarta afirmacion de convergencia que este trabajo producia y era falsa. Por eso el guard nuevo cuenta llamadas con parentesis y exige EXACTAMENTE UNA: prohibir el nombre dejaria fuera la llamada legitima del resolver canonico, y contarlo sin parentesis contaba tambien la linea use (que es como el guard dio 2 en vez de 1 en su primera version). DE PASO un defecto PREEXISTENTE: find_persisted_fallback_seed solo encontraba recibos con identity_source == Fallback, luego un recibo escrito BAJO UN PIN era in
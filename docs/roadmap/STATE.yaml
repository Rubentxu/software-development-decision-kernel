  session_69s: 'R2 REVALIDADA, NO CERRADA. Se hizo la revision de vigencia de las cinco deudas de identidad, que es la otra mitad de lo que la revalidacion nombro como paso preciso. NINGUNA DEUDA SE CIERRA Y NINGUNA SEVERIDAD BAJA; lo que se corrige son cifras y una conclusion ya publicada. Documento: docs/roadmap/receipts/c3m5-bounded-contexts/REVISION-VIGENCIA-R2.md. INC-DEBT-060: LA PROPIEDAD ES FALSA HOY, MEDIDA FILA A FILA. sddk cycle list con el binario de HEAD sobre el ledger real nombra 108 de 108 ciclos reales de p-63676b11dc0ef88f, 0 sin nombrar, y declara unreadable_manifests: 2 que coincide exactamente con las 2 filas reales cuyo manifiesto no deserializa. Es la tercera medicion (69c, 69m, esta) y las tres convergen. LO QUE QUEDA ABIERTO ES LA SEGUNDA POBLACION: 187 filas son 108 reales + 79 __spine_import__, y las 79 llevan 79, 79, 79 desde 69d. CORRECCION A UNA MEDICION PUBLICADA: REVALIDACION-R2.md seccion 3 mide la tabla cycles entera y publica 187 ciclos y 107 OPEN, que son la SUMA de dos poblaciones (108+79 y 28+79); ninguno de los dos numeros describe este proyecto. El documento de revalidacion NO se reescribe, la descomposicion va en la deuda. INC-DEBT-061: VIGENTE, 6 de 15 alias con historia partida -- el 6 es estable -- y los ciclos apartados SUBEN a 53 (publica 51, revalidacion del mismo dia 52). La deriva viene del lado redirigido (p-b7740b96d79ec013 de 56 a 57), no de que el criterio cambie. INC-DEBT-050: VIGENTE, el alias p-74299cf88f51dab9 -> p-b7740b96d79ec013 conserva 12 ciclos con 6 OPEN en el from_id y su reason cita esta deuda por su nombre. Las dos salidas siguen siendo del operador. INC-DEBT-063: CONFIRMADA. La revalidacion la declaro NOT_VERIFIABLE porque busco los tres recibos en tests/cycle-artifacts/; EXISTEN, en las rutas que la references de la propia deuda cita (docs/roadmap/receipts/cl-vault-{graph,html-replica,node-projection}/RECEIPT.md) y sus tres cycle_id declarados siguen dando 0 filas cada uno. SEPTIMA vez en esta serie que se mide la cosa equivocada, y la segunda con consecuencia grave. MI PROPIA MEDICION FALLO IGUAL: consulte project_id dentro del ledger de p-63676b11dc0ef88f y obtuve 0 alias con historia partida, un 0 tranquilizador del mismo tipo que el 0 de 15 de la revalidacion; los ciclos del lado apartado estan en el ledger del proyecto apartado. HALLAZGO NUEVO, NO ESTABA EN NINGUNA DEUDA: EL BINARIO INSTALADO NO ES EL CODIGO Y NO PUEDE DECIRSELO. ~/.local/bin/sddk declara 2.5.3 --la version del workspace SIN PUBLICAR-- y es de 90f16ad2, 202 COMMITS por detras de HEAD, construido a las 21:17:29 CEST del 2026-10-01, tres horas despues de publicar v2.5.2. No tiene sddk cycle list ni sddk dev build-id: EL ARTEFACTO QUE TIENE EL PROBLEMA NO PUEDE EJECUTAR EL CHECK QUE LO ENCUENTRA. Es la forma mas dificil de la condicion de INC-DEBT-064 y confirma su open/high sin cambiarlo. Y REVALIDACION-R2.md fecha mal el binario que uso (dice build del 2026-10-03 06:57; el fichero es del 2026-10-01 21:17:29), o sea que la revalidacion se hizo CON EL BINARIO VIEJO y por eso no vio que cycle list ya existia. SIGUIENTE PASO: R2 sigue ABIERTA y su cierre necesita un GUARD, no un recuento. La revision de vigencia fija el estado de las cinco deudas; 51 -> 52 -> 53 en un dia demuestra que cualquier numero de este cluster es una fecha, no un hecho. '

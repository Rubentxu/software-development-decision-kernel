  development_head: 'SESSION-66: (A) INC-DEBT-050 — LA MIGRACION NO EXISTE, y se ha descubierto EJECUTANDO. El operador autorizo el apply de los 7 renombrados limpios; se ejecuto y ABORTO con `sqlite3.IntegrityError: events_v1 are append-only`. Nada se escribio. LEYENDO EL STORAGE, no el plan: cinco tablas del ledger (events_v1, attempts_v1, workflow_runs_v1, node_runs_v1, workflow_run_events_v1, backlog_item_events_v1) son APPEND-ONLY por diseno, con triggers BEFORE UPDATE que hacen RAISE(ABORT) y un test que lo exige (cross_ledger_consistency.rs:151). Y no es solo el trigger: EventEnvelopeV1::compute_content_hash anula UNICAMENTE content_hash, sequence y recorded_at, luego project_id, stream_id y cycle_id ENTRAN EN EL HASH. Reescribirlos no seria relajar un trigger: seria dejar verify_stream_chain fallando con hash_drift. EL project_id esta horneado en un fact log encadenado: la identidad de un proyecto es INMUTABLE desde su primer evento. Los 15 proyectos suman 3477 filas append-only y 0 son migrables. Eso explica los 8 proyectos con dos ids: no son efecto secundario de la normalizacion, son la RE-ADOPCION, la unica via que existe cuando la identidad ya no se puede cambiar, y parte el historial en dos. CAMINO DE CIERRE PROPUESTO, no ejecutado: tabla de alias from_id->to_id que el CLI resuelva al derivar (lo que hace git con un rename); no toca el fact log. (B) DEFECTOS DEL PROPIO apply, corregidos antes de ejecutar: UPDATE SIN WHERE (habria reasignado 79 ciclos centinela __spine_import__ y 10 ciclos de otro proyecto, p-490921be0aac9b69), directorio de estado que nunca se renombraba, y Path.replace usado como sustitucion de cadena (TypeError en el primer paso). El original llevaba dos sesiones a un paso sin poder completarse. (C) INC-DEBT-048 CERRADA por la opcion (a) que decidio el operador: spec arch-spec-A3-S1 a `accepted` con REQ-A3S1-021 reescrita (pares ordenados mas revised_at, dominio versionado, revised_at=None reproduce v1), ADR-0126 reconciliado SIN enmendar su Decision, y AT-UAT-019 reescrito para citar REQ-A3S1-021 y ADR-0126. El guard de citas pasa de 1 aviso a 0. Falsificadores RE-EJECUTADOS: F19 da 2 FAIL, F20 da 5 FAIL (el UAT decia 4; session-65i habia anadido un test que depende de la derivacion). (D) DEFECTO PROPIO encontrado de paso: ADR-0151 declaraba `status: accepted` sin accepted_at ni accepted_by_cycle, incumpliendo ADR-0001 3.4. Corregido; el guard vuelve a violations: 0. (E) HALLAZGO ABIERTO, NO ARREGLADO: 13 ficheros de docs/ tienen caracteres CJK, cirilicos o de reemplazo sustituyendo palabras espanolas (U+4E24 U+8005, U+505A U+6765, U+5185 U+5E55, U+043F U+043E U+043D U+044F, U+5370 U+53D1, y dos U+FFFD). Todos preexistentes. NO se corrigen en masa porque la corrupcion se detecta con fiabilidad pero la palabra original NO se puede reconstruir con fiabilidad: sustituirlas seria fabricar. STORAGE INTACTO: 25 receipts siguen huerfanos, que no es un pendiente sino el sintoma de un hecho ahora escrito. BLOQUEO OPERATIVO: sigue faltando aprovisionar la clave del KMS para poder publicar v2.5.3. >> GATES_QUE_responden_sin_examinar_nada_SESSION-65d: DOS defectos del MISMO genero encontrados el mismo dia, y el segundo por un actor distinto del primero. (A) ddfd2b51 (otro actor, ya publicado) corrigio INC-DEBT-053: `ledger verify-chain` resolvia por defecto el stream `project:<id>`, que no existe en ninguno de los 326 ledgers de la maquina, contestaba PASS sobre cero eventos; `debt report`/`gates` fabricaban un informe para un ciclo ajeno sin hallazgos, luego los gates `debt-severity-assigned` y `debt-priority-assigned` eran CONSTANTES. Evaluado: 865 tests del lib verdes, clippy limpio, INC-DEBT-053 bien escrito. PERO le encontre un defecto que sus dos tests no podian alcanzar: `verify_streams` reconstruia la etiqueta con `resolve_streams(None, ..)`, luego `verify-chain --stream X` contestaba `stream: all streams of <project>`. RED medido (left all streams of p-demo / right cycle:p-demo/one), corregido en d76cbb1c haciendo que la etiqueta viaje desde quien la decide hasta quien la publica, con su test. (B) MIO: `doctor --strict` salia con exit 0 SIN MEDIR NADA. Los checks de brevedad se anclaban a `current_dir()` con cada enumeracion dentro de `if let Ok(read_dir(..))`, y `resolve_active_framework_root` ignora el cwd, luego el caso normal (auditar un prefijo instalado desde el directorio de uno mismo) es un cwd sin superficies. Medido sobre el binario publicado v2.5.2: 0 checks emitidos, all_present true, exit 0. Y NINGUN GATE LO EJECUTABA: `grep -rn -- "--strict" .github/` -> 0 coincidencias. Los criterios de ADR-016 siguen vigentes y NO hay waiver, pero su unica aplicacion automatica eran dos tests que montaban una raiz CON superficies, luego ninguno alcanzaba la ruta neutra. Corregido en cfe96856: `has_surface_dirs()` decide si un root puede medirse, se prefiere el cwd y se cae al framework root activo, y sin superficies se falla cerrado nombrando que el presupuesto es INVERIFICABLE y no satisfecho. INC-DEBT-054. Los 19 briefness incumplidores (2 agents, 14 skills, 3 prompts) ya no pueden pasar inadvertidos. (C) Dientes falsificados: los 2 del doctor mueren, cada uno atribuido a su test; el de la etiqueta se observo en rojo antes de corregir. (D) `Cargo.lock` no lo regenero ddfd2b51 al bumpear a 2.5.3, luego declaraba 2.5.2 para los 8 miembros; corregido en 0c512cf6. (E) El gate de cobertura del changelog daba PASS=0 FAIL=3 porque 2.5.3 no tenia seccion; escrita en 9085402b, ahora PASS=6 FAIL=0. (F) CIERRE session-65d: `sddk dev install` llevo la autoridad local a 2.5.3 — hubo que compilarlo antes, porque `dev install` instala el binario que se esta ejecutando y con el 2.5.2 del PATH se habria reinstallado el mismo 2.5.2. El bundle sigue en 2.5.2: `dev install` desde checkout escribe `bundle: false` y el bundle 2.5.3 exige publicar la release. VALIDACION CONTRA EL BINARIO INSTALADO, la que faltaba: el escenario que con v2.5.2 daba 0 checks y exit 0 ahora da (a) raiz del repo 19 violaciones exit 1, (b) cwd sin superficies con bundle resoluble 183 checks emitidos y 19 violaciones exit 1 — el fallback al framework root funciona, (c) cwd sin superficies y sin bundle 1 check surface.briefness.root present=false y exit 1 con detalle ''unverifiable here, not satisfied''. Las 19 coinciden con el recuento independiente hecho antes de tocar nada. CONSECUENCIA ACEPTADA: `--strict` ya puede fallar y va a fallar (19 presupuestos), y la fase verify de todo proyecto deja de poder autorizarse con los dos gates de deuda. Es el aviso que los gates ciegos reprimian; la salida es implementar la deteccion y adelgazar las superficies, no restaurar el PASS constante. BLOQUEO OPERATIVO: solo la autorizacion op-5 (NO el hook, que admite por el segundo disjunct de (A): workspace 2.5.3 > mayor tag publicado v2.5.2). >> RELEASE_V2_5_2_PUBLISHED_SIGNED_AND_CERTIFIED_FROM_PIPELINEK_MIGRATION_25_RECEIPTS_STILL_PENDING_OPERATOR SESSION-65c: (A) v2.5.2 PUBLICADA, FIRMADA Y CERTIFICADA. El bloqueo de session-65/65b (musl-gcc ausente) quedo resuelto por el operador; `release.sh --dry-run` paso los pasos 0-8 con binario estatico real, y el pipeline completo ABORTO en su step 8c con "the project signing identity does not exist on this host" -- es decir, release.sh se niega a publicar sin firma en vez de degradar. Decision del operador: "PipelineK conduce, Actions firma"; el ancla de confianza (SDDK_COSIGN_IDENTITY / SDDK_COSIGN_ISSUER de install.sh) NO se toca. Tag ligero v2.5.2 sobre 818d4ff9 pusheado, `gh workflow run release.yml --ref v2.5.2` -> run 36890390356 success completo. Release: 27 assets, isDraft=false, isPrerelease=false, publishedAt 2026-10-01T16:22:15Z. (B) CERTIFICACION DESDE PIPELINEK: nueva `pipelines/certify-sddk-release.pipeline.kts` (8 etapas) en el harness, commit local fc249b8 SIN pushear (op-5). Al EJECUTARLA aparecieron 8 defectos que leer el fichero no habria encontrado: una etapa NO corre en el workspace (cada una tiene su sandbox, luego un workdir relativo entre etapas no puede funcionar), los raw strings NO se dedentan (un heredoc con la indentacion del .kts nunca cierra y cat sale 0: etapa VERDE escribiendo fichero corrupto), want_id guardaba el comando en vez de ejecutarlo, case comparaba el pin como patron cuando el valor real lleva un backslash delante de yml, pins.env sin comillas perdia los backslashes al hacer source, curl -o recibia la URL como ruta, la etapa de instalacion pedia un scripts/install.sh que el bundle publicado NO contiene, SDDK_BASE_URL con el tag producia una URL doble (404), y SDDK_FRAMEWORK_DIR default iba a SOBRESCRIBIR el bundle runtime del operador. Corregidos los 8, con 28 tests estructurales y 19 mutaciones; las 3 que sobrevivieron la primera ronda (destino de descarga, escape de val, PIN VACIO) eran exactamente la clase de defecto que la etapa existe para cerrar: un pin vacio es cosign diciendo "acepta cualquier firmante". Ejecucion final 8/8 verdes, cosign Verified OK bajo los pins leidos de install.sh, install desde la URL publica, doctor all_present, verdict CERTIFIED. (C) `test_supply_chain_authenticity.sh --tag v2.5.2` = PASS=13 FAIL=0 SKIP=0 con sus 3 controles negativos; addendum en INC-AUDIT-S14-SUPPLY-CHAIN-AUTHENTICITY, que NO cierra nada nuevo (sigue closed desde session-43 con testigo v2.2.27). (D) PUNTERO RECONCILIADO: last_public_release_observed era v2.4.2 y workspace_version_at_current decia DECLARADA-NO-PUBLICA; ambas afirmaciones eran falsas y se corrigen con evidencia observada. HALLAZGO FUERA DE ALCANCE, REPORTADO NO ARREGLADO: certify-candidate.pipeline.kts y promote-release.pipeline.kts del harness tienen el mismo defecto de workdir relativo entre etapas y no pueden completarse; no se tocaron porque no es el bug de ese fichero. PENDIENTE: `sddk dev install` (el binario del PATH sigue en 2.4.2), la migracion de los 25 receipts (apply intacto, digest b98e9a8d, backup verificado, espera autorizacion nueva), RC 0.45.0 de PipelineK (accion externa no autorizada), push del harness (op-5, arrastraria 40 commits). >> SESSION-65: (A) INC-DEBT-051 REGISTRADA (high/P1, open) -- `sddk release plan` y `release apply` NO son utilizables en ningun proyecto que no sea Rust: `ensure_version_lockstep` (crates/sddk-engine/src/version.rs) hardcodea root.join(Cargo.toml) sin consultar adapters. AGENTS.md 2.3 declara la politica agnostica de lenguaje/build/test runner y lista BAZEL -- Gradle y Bazel son el mismo caso, luego es desviacion de un principio declarado, no limitacion legitima. El arreglo es un CONTRATO NUEVO -> SCOPE + ADR. (B) `scripts/migrate_project_identity.py` ERA EL MISMO INC-DEBT-050: su espejo de `normalize_remote_url` reimplementaba el normalizador en Python con reglas PARECIDAS PERO DISTINTAS al Rust (rechazaba git@host:owner/repo, la forma de remote MAS COMUN; trataba el puerto por defecto como global en vez de por esquema; str.isdigit() donde el Rust exige ASCII; aceptaba authority y puerto vacios; crasheaba con UnboundLocalError en IPv6). Un apply con ese espejo habria escrito ids equivocados en ledgers reales. El golden pin de session-64 ya blindaba el camino del remote en Rust; este script era una segunda implementacion sin blindaje.'

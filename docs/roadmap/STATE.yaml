  session_69s_bis2: 'EL GUARD QUE R2 NECESITABA, ENTREGADO PARA INC-DEBT-060 Y DESCARTADO CON RAZON PARA 061. tests/test_cycle_list_total_reconciliation.sh mas su autofalsacion tests/test_cycle_list_total_reconciliation_mutation.sh. LO QUE NO SE MIDIO PRIMERO Y HAY QUE DECIR: la comparacion trivial total declarado == filas emitidas ES INSATISFACCIBLE, porque cycle list imprime su total como output.cycles.len() (crates/sddk-cli/src/cycle.rs:2115), o sea del MISMO vector que emite tras el filtro; un guard que midiera eso daria verde siempre. Se intento, se descarto, y el error era del diseno del guard y no del producto. LA QUE TIENE DIENTES ES DE FUENTE CRUZADA: lo que declara el producto contra las filas que la autoridad tiene para el proyecto que el propio producto declara. Es la comparacion que habria detectado el 187 = 108 + 79 que publico REVALIDACION-R2.md. HERMETICO Y CON EL PRODUCTO REAL, NO UN MOCK: state home temporal por caso (SDDK_STATE_HOME), el ledger lo crea el propio producto (el esquema es el suyo, sin segunda copia de las migraciones aqui) y el project_id se descubre del stdout, no se supone. SEIS CASOS: una poblacion; dos poblaciones (declara 5, no 9); ilegibles contados y marcados; las dos a la vez; proyecto vacio; y el filtro por estado. FALSADO CON NUEVE MODOS DE MENTIRA, todos detectados, MAS UN CONTROL que exige que el caso bueno se ACEPTE, porque un guard que rechazase todo pasaria la falsacion sin vigilar nada. PASS=16 FAIL=0. CADA MUTACION CORRUPTE UNA SOLA DECLARACION, y esa correccion fue el error mas instructivo de la sesion: la primera version corrompia dos a la vez (M3 el resumen Y las marcas, M4 el desglose Y un estado), con lo que el falsificador CONCLUYO que cinco comprobaciones eran la misma repetida. Eran distintas: cada una compara una DECLARACION distinta, y una mutacion compuesta no puede decir cual las cascada. Ademas una comprobacion sin mutacion propia es una comprobacion cuya necesidad queda sin demostrar: por eso nueve mutaciones y no seis. LA AUTO falsacion DE LA AUTO falsacion: el segundo fichero exige que cada comprobacion sea load-bearing POR SEPARADO (G0..G8), borrandola en una copia de sandbox y requiriendo que se pierda exactamente la mutacion que dice; sin eso un guard puede rechazar las nueve por efecto colateral y seguir pareciendo que vigila. PASS=10 FAIL=0. INC-DEBT-061 NO LLEVA GUARD Y ESTA DECIDIDO QUE NO LO LLEVE: su propiedad es cierta por construccion del almacenamiento y no hay superficie de producto con la que reconciliarla; un script que la midiera sin consumidor seria el hueco de INC-DEBT-065 con forma de gate. Un guard que mide algo que ningun gate consulta no vigila: informa. TAMBIEN MEDIDO, Y SON DEFECTOS DEL GUARD QUE LOS ARREGLO EN EL GUARD: el binario pasado por SDDK_GUARD_BIN no se comprobaba de capacidad, con lo que el fail-closed se podia desactivar con una variable de entorno y un chequeo que se puede desactivar no es un chequeo; el descubrimiento no miraba CARGO_TARGET_DIR, que en esta maquina esta fuera del repo, con lo que el guard fallaba cerrado sin motivo y acababa sin usarse; y sddk --version escribe en STDERR, no en stdout, con lo que el guard imprimia una version vacia en su propio mensaje de error. Los tres verificados despues de arreglarlos, no supuestos. shellcheck CLEAN en los dos ficheros. LO QUE EL GUARD NO DEMUESTRA, escrito para que no se lea al reves: no mide el ledger real de este repo (los contrastes 108 de 108 fueron a mano y son evidencia de la sesion), no cubre la poblacion __spine_import__ porque esta fuera del alcance de project_id y no hay comando que la pida, y no comprueba ledger events ni otra superficie. Detalle: REVISION-VIGENCIA-R2.md seccion 6.'
  # session-69s bis 3: este puntero nombra 1beaeb78, el ANTERIOR a este fichero, misma razon de siempre.
  session_69s_bis3: 'HALLAZGO QUE NO ESTABA EN EL PLAN: EL CAMINO DE PUBLICACION MORIA ANTES DE COMPILAR, y no por el motivo que se sospechaba. tests/test_gate_coverage.py corre en el paso 1b de scripts/release.sh y su fallo hace die, y estaba en ROJO desde antes de este trabajo con cuatro tests/test_*.sh sin runner. MEDIDA LA CONSECUENCIA, NO SUPUESTA: bash scripts/release.sh moria en 1b, con lo que la release 2.5.3 no podia publicarse por un motivo que no era la clave KMS sino una lista escrita a mano que se habia quedado corta. LOS CUATRO MEDIDOS UNO A UNO ANTES DE TOCAR NADA: test_build_identity_policy PASS=8, test_kmt_canonical_meaning PASS=6 y test_release_build_identity PASS=22, los tres hermeticos y con forma de bash test.sh, y por eso ENTRAN al bucle. El cuarto, test_doctor_identity_states, NO: exige DOS BINARIOS COMO ARGV con procedencia distinta a proposito, porque lo que mide son los cuatro estados de binary.build_identity y dos de ellos solo se alcanzan asi; con ${1:?uso: ...} sale por argv con codigo 1, o sea un rojo que no mide nada. Va a EXCEPTIONS con el motivo escrito Y CON LA CONSECUENCIA DECLARADA: los cuatro estados de la identidad NO se verifican en el camino de release mientras no exista el arnes que construya los dos binarios. Una excepcion sin su consecuencia escrita es un hueco silencioso. RESULTADO: gate de cobertura en RESULT: PASS con SIN runner y SIN motivo: 0 sobre 47 tests (41 con runner, 6 excepcionados con motivo); antes eran 5 sin runner. EL GUARD DE RECONCILIACION, CABLEADO EN PASOS NUEVOS 3b/14 Y 3c/14, DESPUES DEL BUILD Y NO EN EL 1b: el 1b corre antes de compilar, luego ahi no hay binario de release y el guard fallaria cerrado matando la release por un binario que todavia no existe. Despues del build reconcilian EL ARTEFACTO QUE SE VA A PUBLICAR, que es mas fuerte que reconciliar un binario de desarrollo. Medidos: 3b con el guard 3,6 s y PASS=16 FAIL=0; 3c con su autofalsacion 36,5 s y PASS=10 FAIL=0. LA AUTO falsacion ENTRO EN CONTRA DE MI PRIMERA DECISION: argumenté que 36,5 s contra 3,6 s no compensan re-falsar un guard que no ha cambiado, y test_gate_coverage.py lo veto POR LA VIA CORRECTA, porque los motivos que EXCEPTIONS acepta son SEMANTICOS --un test que pasa sin medir, o uno que necesita contenedores-- y no es lento. Una release que ya compila el workspace entero puede pagar 40 s: la falsacion opcional es una falsacion que no corre. La excepcion preferida era el atajo que este repo lleva siete sesiones rechazando. DEFECTO DE release.sh QUE SALIO AL MEDIR ESTO Y NO ESTABA BUSCADO: ok binary: $BIN ($($BIN --version)) imprimia la version VACIA porque sddk --version escribe en STDERR. Es el mismo defecto que se corrigio en el guard unas horas antes y seguia vivo en el script de publicacion: la unica linea que dice que binario se va a publicar no lo decia. Corregido a 2>&1 y verificado con el TEXTO REAL extraido de release.sh, no con una copia: rama buena PASS=16 FAIL=0 exit 0, y rama de fallo con un binario sin cycle list, donde el guard falla cerrado, se imprime el log y die con exit 1. El mensaje de die NO afirma el motivo, porque el bloque solo midio que el guard no quedo en verde. INC-DEBT-064 Addendum: los tres contratos de identidad pasan a ser gates de release, lo que reduce la probabilidad de que un artefacto con identidad rota llegue a un tag pero NO TOCA LA CONDICION, asi que la severidad sigue en high y el status en open. Detalle: REVISION-VIGENCIA-R2.md secciones 6.3 y 6.4.'
  # session-69s bis 4: este puntero nombra 2b3a4526, el ANTERIOR a este fichero, misma razon de siempre.
  session_69s_bis4: 'LOS CUATRO ESTADOS DE binary.build_identity VUELVEN AL CAMINO DE RELEASE, en contra de lo que estaba escrito, y el modo que lo permite se produjo por medicion. test_doctor_identity_states.sh estaba excepcionado en test_gate_coverage.py porque EXIGE DOS BINARIOS COMO ARGV y el camino de release solo tiene el concluyente. MEDIDO, Y ES LO QUE JUSTIFICA EL MODO: pasando el binario concluyente en los dos huecos, O2, O3, O4, O5 y O7 pasan y SOLO O6 falla (PASS=17 FAIL=2), porque O6 es el unico objetivo que depende de la procedencia NO concluyente y los demas dependen solo de la identidad concluyente y del checkout contra el que se compara. Y EL PRECIO DE MEDIRLO ENTERO, MEDIDO TAMBIEN: una compilacion en frio del perfil debug son 118,77 s con time y target dir limpio, o sea ~2 min por publicacion para medir UN estado, el de STOP 6, en el que el check POR DISENO NO DECIDE. EL GUARD GANO UN MODO DE UN SOLO BINARIO: corre O2-O5 y O7, DECLARA O6 como NOT_RUN con su motivo, y BAJA LA CUENTA DE VEREDICTOS DE 5 A 4, que es lo que de verdad se midio. No lo cuenta como passed, no lo salta en silencio y no relaja el resto. Es UNA autoridad para la propiedad, no una copia con menos aserciones: duplicar el guard con un subconjunto seria la misma clase de violacion de autoridad canonica que este repo ya corrigio una vez. EL UMBRAL PARAMETRIZADO SE FALSIFICO, NO SE DECLARO: quitar el registrar de un escenario baja el recuento en exactamente 1 y O7 lo detecta POR DOS MECANISMOS INDEPENDIENTES (contador y lineas) en los dos modos, sin que ningun otro aserto se mueva -- PASS=14 FAIL=2 y PASS=17 FAIL=2. Un umbral que nadie ha visto caer es decoracion. COMO SE FALSIFICO, Y HAY QUE CONTARLO PORQUE SALIO MAL PRIMERO: la primera copia se ejecuto desde /tmp, con lo que el guard calculo REPO como / y el escenario de atraso no pudo clonar -- dos fallos mas que eran de la copia y no del guard, y que casi se leyeron como un defecto del umbral. La falsificacion correcta es una copia DENTRO de tests/, para que REPO resuelva al repo de verdad, y ahi solo cae el recuento. RESULTADO: test_gate_coverage.py en RESULT PASS con 42 con runner, 5 excepcionados con motivo y SIN runner y SIN motivo 0; antes eran 41 y 6. El guard entra en release.sh como paso 3d/14 contra el binario publicado, verificado con el TEXTO REAL extraido del script: rama buena PASS=16 FAIL=0 exit 0 en 4,2 s, y rama de fallo con un binario sin dev build-id (PASS=4 FAIL=12) que mata la release. LO QUE 3d NO CUBRE, y es el residuo honesto: el estado de procedencia NO concluyente (source: git) sigue siendo COBERTURA DE SESION, NO DE PIPELINE. No lo arregla este paso: lo arregla el arnes que construya los dos binarios, que es trabajo declarado y no una excepcion. Y por eso INC-DEBT-064 sigue open y high: cablear los contratos al release reduce la probabilidad de que un artefacto con identidad rota llegue a un tag, pero NO TOCA LA CONDICION, que es un binario obsoleto en el PATH. Gates: shellcheck CLEAN en el guard modificado y en release.sh, test_gate_coverage PASS, test_release_pipeline_consistency PASS, test_release_ci_contract PASS (19 checks), test_changelog_coverage PASS=81 FAIL=0, deny lint 6/6 a 0 hits, git diff --check CLEAN, bash -n OK. cargo test NOT_RUN y declarado: sin cambio en crates/.'
  # session-69s bis 5: este puntero nombra dfd5c306, el ANTERIOR a este fichero, misma razon de siempre.
  session_69s_bis5: 'C3n.1 CERRADO, Y EL GUARD QUE LO VIGILA SE FALSIFICO A SI MISMO DOS VECES. Entregado tests/test_uat_boundary_receipt.sh (PASS=14 FAIL=0), cableado en release.sh como paso 3e/14, mas la reescritura de ROADMAP-ACCEPTANCE-TRUTHFULNESS.md seccion C3n.1 con el vocabulario canonico y la reconciliacion de las 4 filas discordantes de UAT-MATRIX.md. LO QUE RESUELVE, MEDIDO SOBRE LAS 26 FILAS AT-UAT: el conjunto de niveles que exigen receipt de frontera estaba escrito EN DOS SITIOS QUE NO COINCIDIAN, y el NOMBRE del nivel decidia si una fila exigia o no; 13 de las 26 quedaban exentas sin que nadie lo hubiera decidido. El conjunto esta ahora en un solo sitio y el guard lo LEE de ahi, porque un guard con el conjunto copiado dentro habria sido la TERCERA declaracion, y la tercera es la que diverge. CONJUNTO POR DECISION EXPLICITA DEL OPERADOR, literal a la seccion: exigen PROCESS (4 filas), MCP_EXTERNAL (2) y RELEASE_ARTIFACT (1), o sea 7. Las otras 13 quedan DECLARADAS exentas y el guard comprueba que ese numero no crece en silencio: no es un cierre, es una cifra escrita con un control que la vigila. El guard valida TIPO y no solo presencia: process_count: por medir NO PASA (entero >= 1) y binary_sha256 tiene que ser 64 hex; la presencia la pone cualquiera, el tipo no. LO QUE LA FALSIFICACION ENCONTRO, Y ERA EL GUARD Y NO EL PRODUCTO, DOS VECES. PRIMERO: un literal escrito a mano que no casaba y no fallaba. El titulo de la seccion estaba escrito TRES veces en el guard y una de las tres tenia las tres ultimas letras TRANSPUESTAS (a-r-i-e donde el documento dice a-r-i-o). find devolvio -1 SIN ERROR, y en python -1 como segundo argumento de find significa buscar desde el final: la mutacion no muto, escribio un fichero de 42 KB --el documento entero MAS el bloque nuevo-- donde deberia haber escrito el documento con el bloque cambiado. Un literal escrito a mano que no casa no degrada a un fallo: degrada a SILENCIOSO. Es la misma clase que el guard existe para cazar, escrita en el guard, y es la segunda vez en esta serie que el falsador encuentra en si mismo lo que la inspeccion no. Arreglo: el titulo se declara UNA vez (SEC_HEADING), los tres lectores lo reciben y salen con codigo 2, y la mutacion se relee despues de escribir, porque una mutacion que no se puede observar no es una mutacion: es un cambio de fichero. SEGUNDO: la comprobacion (e) era VACIA, y lo dijo el mismo examen. Afirmaba que el gate no tiene una tercera declaracion del conjunto, pero releia el spec con un extractor PROPIO, luego con el conjunto copiado dentro del gate habria dado PASS igual. Ahora prueba la DECISION: muta la autoridad a un nivel que hoy NO exige (MIXED), reextrae por la MISMA FUNCION que usa (a) y pasa un receipt de ese nivel sin campos de frontera por el VALIDADOR REAL. Con el conjunto real se acepta (hueco declarado) y con el mutado PASA A RECHAZAR; ese cambio de veredicto es la prueba, no la lectura de un valor. FALSADO EN LAS DOS DIRECCIONES: inyectando el conjunto dentro de leer_conjunto cae (PASS=13 FAIL=1, y el unico fallo es (e)), y con una mutacion imposible declara (e) no se ha ejecutado en vez de emitir un veredicto falso. Un guard que solo sabe decir PASS/FAIL no distingue no vigilar de mirar y no ver nada. Cobertura: test_gate_coverage.py en RESULT: PASS, 43 con runner, 5 excepcionados, SIN runner y SIN motivo: 0. TAMBIEN SE CORRIGIO UNA DERIVA PREVIA: la tabla del pipeline en AGENTS.md seccion 8 no reflejaba los pasos 3b, 3c ni 3d que ya existian; ahora los cuatro estan escritos con su gate y su comprobacion. NINGUNA DEUDA SE CIERRA Y NINGUNA SEVERIDAD BAJA. cargo test NOT_RUN: no hay cambio en crates/. SIGUIENTE: C3n.2, recertificacion AIW, que es lo que no depende de ninguna decision del operador; R1 sigue esperando la clave de firma.'

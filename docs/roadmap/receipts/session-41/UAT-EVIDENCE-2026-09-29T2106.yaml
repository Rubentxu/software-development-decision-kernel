## El bug que hacía el handoff durable imposible

El primer `drain` devolvía `applied: 0` con todos los deltas **rechazados
como stale**. Causa: el servicio rehidrataba el bridge en la base *actual* del
binding, así que todo delta ya consumido tenía `from_revision` distinto del
punto de partida y `ContextBridge` lo rechazaba. El bridge reconstruido
volvía vacío.

La rehidratación correcta **rebobina al origen del stream**
(`FilesystemDeltaStore::origin_basis` = `from_revision` del primer delta), no
a la base actual. El stream es lo único que sabe dónde empezó, así que es lo
único autorizado a decirlo. Corregido en `8ff09e25`.

Segundo defecto, encontrado por el árbol sucio antes de commitear: un
`delta-2.json` apareció en la raíz del repo. Era de una ejecución fallida
temprana del test de corrupción, que escribía en el CWD. El helper `deltas_dir`
ahora hace `assert!(dir.is_dir())` y falla ruidosamente en vez de escribir donde
sea. No se reproduce con el código actual (verificado: ejecutar el test
aislado no recrea el fichero).


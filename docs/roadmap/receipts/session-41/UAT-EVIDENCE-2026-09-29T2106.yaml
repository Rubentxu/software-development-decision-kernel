## Conocimiento negativo (esta sesión)

- **Rehidratar no es "arrancar en la base actual".** Es la lección central:
  `ContextBridge` rechaza deltas cuyo `from_revision` no coincide, lo cual es
  correcto en memoria y **fatal** al reconstruir desde disco. Un store durable
  necesita exponer su origen, no sólo su contenido.
- **El servicio rehidrata al origen, pero `publish` sigue la base actual.**
  Son dos direcciones opuestas y confundirlas rompe una de las dos.
- **Un `python3 -c` con `str.replace` sobre escapados de shell no es
  herramienta de edición.** Dos intentos de normalizar `\'` en un script
  fallaron y el script quedó con escapes que `bash -n` aceptaba. La solución
  fue reescribir el helper sin `eval` ni escapado (`field`/`size`/`index` con
  `sys.argv`).
- **Los nombres de fichero del stream llevan 12 dígitos de seq**
  (`delta-000000000002.json`). Un UAT que busque `delta-2.json` no encuentra
  nada y falla con un mensaje engañoso.
- **Un fichero no commiteado en la raíz del repo es evidencia de un test que
  escribió fuera de su sandbox.** Vale la pena revisar `git status` antes de
  commitear, no sólo después de los tests.


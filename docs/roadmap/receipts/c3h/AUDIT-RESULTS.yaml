narrative:
  f1_quinn_proto:
    The quinn-proto 0.11.14 entry was stale in Cargo.lock: cargo tree -i
    shows no reverse dependency. A past bump or workspace restructuring
    removed it from the dep graph but the lock entry persisted. The
    targeted update (--precise 0.11.15) cleaned both the advisory and
    the stale entry.

  f2_time:
    time was a direct dep pinned at exactly 0.3.36 by
    Cargo.toml [workspace.dependencies]. The pin was set to address a
    previous concern; it had not been revisited since. Bumping to 0.3.47
    (the latest 0.3.x at audit time) addresses RUSTSEC-2026-0009
    (stack exhaustion in date parsing) without API drift — usage is
    limited to OffsetDateTime::now_utc(), .format(), .unix_timestamp(),
    all stable APIs.


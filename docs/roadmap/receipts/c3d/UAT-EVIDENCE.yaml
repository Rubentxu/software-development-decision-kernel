## Surprises during execution (real, not pre-planned)

1. **Tight threshold on lease**: my first threshold (5 ms) was too optimistic; the measured mean was 15 ms on this hardware. Adjusted to 100 ms (loose) to absorb run-to-run variance without losing >5× regression detection. The variance itself is documented in the bench comment.
2. **Helper visibility**: my first attempt to call `envelope_with_event_id` from `event_store::bench` failed because the helper is private to `event_store::tests`. Solution: declare a local mirror `bench_envelope` inside `mod bench`. Documented in code.
3. **Mod tests scope**: my first CAS bench landed AFTER the closing `}` of `mod tests`, so `temp_cas` was out of scope. Solution: move the bench inside the existing `mod tests`. Documented in code.


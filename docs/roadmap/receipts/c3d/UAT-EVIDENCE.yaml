## Measured numbers (real, observed this session)

Hardware: Linux x86_64, tmpfs for CAS, in-memory SQLite for event/lease.
Build: `cargo test --profile test` (debug + debuginfo, single-thread).

### T26-append (event_store)
```
N=1000, single-stream, single-thread, in-memory SQLite
mean = 339 µs,  p50 = 333 µs,  p99 = 410 µs
```
Threshold: < 10 ms. Result: **PASS** (~30× margin).

### T26-cas (FilesystemCas)
```
N=1000, 4 KiB blobs, put+get round-trip on tmpfs
mean = 439 µs,  p50 = 436 µs,  p99 = 478 µs
```
Threshold: < 5 ms. Result: **PASS** (~11× margin).

### T26-lease (Storage)
```
N=1000, acquire+release pair on a single cycle, in-memory SQLite
mean = 14959 µs (15 ms),  p50 = 14556 µs,  p99 = 21956 µs
```
Threshold: < 100 ms. Result: **PASS** (~6.6× margin).
Note: high run-to-run variance observed (means between 15 ms and 35 ms across 3 runs). The bench is intentionally loose; tight perf gating is a criterion-engineering concern deferred to a future cycle.


## Defecto nuevo encontrado y corregido en este slice: test H05 vacuo

**Síntoma observado:** `bash tests/test_h05_isolation.sh` con los artefactos
release construidos reportaba `PASS=0 FAIL=0` con exit 0 — ambos checks
saltaban porque el test solo leía `$CARGO_TARGET_DIR` del entorno y este
sandbox redirige el target dir via `~/.cargo/config.toml [build] target-dir`
(`/var/home/rubentxu/cargo-targets`). El test preguntaba al entorno; cargo
leía su config. Dos fuentes de verdad, y el test usaba la equivocada.
Un guard que no mira nada y sale 0 es un paseo vacuo (misma familia que el
falso positivo de `test_vault_coherence_alignment` de session-33b).

**Fix (`89f60190`):** el test resuelve ahora el target dir con precedencia
env explícito → `cargo metadata` (fuente única de verdad de cargo) →
default `./target`.

**Falsación en ambas direcciones (observed):**

1. Fake no-ELF con el canary dentro (printf de 50 bytes): `nm` falla
   silenciosamente (formato no reconocido) → PASS. **Hallazgo:** el guard
   asume artefactos bien formados; un fichero corrupto no dispara FAIL.
   Aceptado: el modelo de amenaza es "el símbolo se exporta en un build
   real", no "alguien planta bytes arbitrarios en target/".
2. ELF real compilado con `void set_process_service_for_tests(void){}`:
   `FAIL binary leak … found in 1 line(s)` en la rama binario; copiado como
   `.rlib`, `FAIL` también en la rama rlib. Exit code real bajo `set -e`:
   **1** en ambos casos. El guard falla cerrado con artefactos reales.
3. Árbol verde + fix: PASS=2, exit 0 (re-confirmado tras las falsaciones).
4. `shellcheck tests/test_h05_isolation.sh`: limpio.


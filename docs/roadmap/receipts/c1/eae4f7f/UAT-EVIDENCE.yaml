- `saw008`: end-to-end, el `StructuredWorkExecutor` produce un `Contributed` (success fabricado) cuando el `return_schema` contiene un descriptor desconocido. Esto es exactamente el bug que ROADMAP H01 ataca.

## §2 Aplicación del fix mínimo

**Diff (verbatim):**
```diff
--- a/crates/sddk-engine/src/structured_work.rs
+++ b/crates/sddk-engine/src/structured_work.rs
@@ -203,7 +203,14 @@
         "array<string>" => v
             .as_array()
             .is_some_and(|a| a.iter().all(|x| x.is_string())),
-        _ => true, // unknown descriptors are pass-through (coarse schema)
+        // H01 of ROADMAP §2 C1: unknown descriptors must NOT match.
+        // Previously this arm was `_ => true` (pass-through), which silently
+        // accepted any shape, allowing the executor to fabricate
+        // `Contributed` outcomes for descriptors that were not part of
+        // the supported allow-list ("string" | "u64" | "bool" |
+        // "array<string>"). Any future descriptor must be added here
+        // explicitly with its matcher.
+        _ => false,
     }
 }
```

Cambio de 1 línea: `_ => true, // unknown descriptors are pass-through (coarse schema)` → `_ => false,` con comentario explicativo del ROADMAP H01.


## §6 Compatibility assessment

El cambio `_ => true` → `_ => false` en `shape_matches` es **estrictamente más estricto**. Cualquier descriptor desconocido que antes pasaba como match ahora falla. Esto puede romper consumidores que envíen descriptores no documentados. Análisis:

- **Tests existentes**: 5 SAW tests + 1313 otros en `sddk-engine`. Todos siguen verdes. → No hay consumidor interno afectado.
- **Host adapters**: `StructuredWorkExecutor::run_structured` es el boundary público. El cambio endurece el boundary (más estricto). Si un adapter envía un descriptor no soportado, antes obtenía `Contributed` (success fabricado), ahora obtiene `SchemaViolation`. Esto es la semántica correcta.
- **Riesgo bajo**: el comportamiento "fabricated success" anterior era un bug; reemplazarlo por "rejection explícito" corrige la semántica sin perder funcionalidad útil.


defects_found_and_fixed:
  - id: LINT-PATH-1
    title: "SDDK011/SDDK013/SDDK018 reportaban un path inexistente"
    root_cause: >-
      lint_agent_registry y lint_agent_model_registry reconstruian el path del
      diagnostico como agents/{stem}.md, descartando el directorio real. Los
      tres ficheros agents/skills/*/SKILL.md se reportaban como agents/SKILL.md,
      que no existe en el repo.
    why_it_mattered: >-
      Un diagnostico que senala un fichero inexistente es inaccionable: el
      operador no puede abrir lo que el gate le dice que abra.
    fix: "strip_prefix(root) en ambos walks, mas test que fija el contrato"
    files:
      - crates/sddk-cli/src/lint.rs
      - crates/sddk-cli/tests/cli.rs
    test: "agent_registry_reports_the_real_path_of_nested_agent_files"

  - id: LINT-HINT-1
    title: "El hint de SDDK009/SDDK010 no regeneraba el fichero del repo"
    root_cause: >-
      El hint decia `sddk generate docs --root .`, pero sin `--in-repo` el
      comando escribe en XDG (politica zero-intrusion, ADR-0011) y nunca
      refresca docs/generated/. El comando con el flag correcto no cambia nada
      en el fichero sin `--in-repo`, lo que hace el hint indistingible de un bug.
    why_it_mattered: "El gate era irrecuperable siguiendo su propia instruccion."
    fix: "Anadido --in-repo y la razon en ambos hints"
    side_effect: >-
      Al regenerar correctamente, docs/generated/workflow.md perdio 4 estados
      (REMEDIATING, RECOVERING, UAT_WAITING, APPROVAL_PENDING) y 1 fase
      (review) que el doc commiteado contenia y workflow/workflow.yaml no
      declara. El doc estaba generado desde un manifest obsoleto.
    files:
      - crates/sddk-cli/src/lint.rs
      - docs/generated/workflow.md
      - docs/generated/inventory.md

  - id: WORKFLOW-CONTRACT-1
    title: "El contract test anclaba el verify post-transicion en el indice equivocado"
    root_cause: >-
      La condicion exigia archive_verifies[1] > archive_post_transition_status.
      El prompt verifica tres veces antes del status post-transicion (verificacion
      inicial, archive.vault.complete, evaluacion), por lo que el indice [1]
      apuntaba a un paso pre-transicion y la condicion fallaba contra un prompt
      correcto.
    fix: "Anclado en archive_verifies[-1]"
    mutation_test: >-
      Se elimino el verify post-transicion de prompts/sddk/phases/archive.md y
      el test sigo fallando; se restauro y volvio a 498/498. El test detecta la
      regresion que dice detectar.
    files:
      - tests/test_workflow_contract.py

known_debt_not_touched:
  - id: AGENTS-SKILLS-PLACEHOLDER
    evidence: "9 errores SDDK011/013/018 sobre agents/skills/*/SKILL.md"
    origin: "dc297ca2 feat(skills): materialize three M7.5 placeholder skills"
    reason: >-
      Los tres ficheros usan frontmatter de skill (name: core.*,
      user-invocable: false) pero viven bajo agents/, que el lint trata como
      directorio de agentes. Es una decision de layout, no un bug de tooling.
      Corregirlo exige decidir si se mueven a skills/ o se declaran como
      agentes, y ambas son cambios de superficie de bundle.
    blocking_for: "lint gate verde en la rama principal"

limitations:

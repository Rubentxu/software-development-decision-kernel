    La suite completa se ejecuto con `cargo test --workspace` (sin --locked);
    el CI usa --locked. No es el mismo comando exacto.
  - >-
    El shellcheck rojo no se investigo mas alla de confirmar que los tres
    ficheros afectados son preexistentes y ajenos al scope de esta sesion.
  - >-
    La regeneracion de docs/generated se hizo sobre el estado actual del
    manifest; no se evaluo si el manifest mismo deberia declarar mas fases.


    binary or Cargo package that implements stdio JSON-RPC per MCP 2025-03-26.
    Once present, re-open C2a SCOPE-CONTRACT and execute T08–T11 as originally scoped.
  secondary: |
    Operator approves SCOPE EXPANSION for C2a.1 to target a different protocol than
    stdio JSON-RPC (e.g. consume `cognicode analyze` output, or talk to the TCP service
    if/when it speaks MCP). This WOULD change Adapter contract and require an ADR.
    Not justified in current state because:
      (a) The TCP service exposed by `cognicode serve --port 8080` does NOT speak MCP.
      (b) No second consumer known for the SDDK adapter.

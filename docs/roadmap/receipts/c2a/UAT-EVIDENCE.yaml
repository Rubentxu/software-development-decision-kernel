cognicode_cli_capability_observation:
  note: |
    RE-INVESTIGATION RESULT: `cognicode serve --port 8080` is NOT the MCP server. It is
    another service (likely the Rayon-based HTTP/gRPC analysis backend) that explicitly
    errors out with "Use 'cognicode-mcp' binary to start the MCP server". The SDDK
    adapter targets `cognicode-mcp` (stdio JSON-RPC, IPB-001..012); the CogniCode CLI
    v0.97.3 ships only the legacy `cognicode` CLI plus a non-MCP TCP service. There is
    NO installed and NO installable binary that matches the SDDK adapter's contract.

  subcommands_alternative_to_mcp:
    - "cognicode analyze [PATH]   # direct CLI mode, not JSON-RPC"
    - "cognicode navigate         # LSP, not MCP"
    - "cognicode graph            # direct CLI"
    - "cognicode index            # direct CLI"

  adapter_cli_alignment_gap:
    description: |
      SDDK adapter (crates/sddk-engine/src/code_intelligence_port_mcp.rs:74-81) spawns
      `cognicode-mcp` over stdio JSON-RPC. Hardcoded references:
        - adapter doc comment: "Spawns the real `cognicode-mcp` binary over stdio"
        - adapter line 290: `provider_build: format!("cognicode-mcp/{}", server_version)`
        - cli line 64: doc `--provider-bin <cognicode-mcp path>`
        - cli line 172: error message `verify: --domain static_provider requires --provider-bin <cognicode-mcp path>`
        - cli lines 204,240,252,265,274: `provider_build` and `cognicode-mcp://` URI prefix
      None of these can be exercised against the available `cognicode` v0.97.3 CLI.


## Surprises during execution (real, not pre-planned)

1. **`CycleStatus` variants**: my first attempt used `CycleStatus::Active` which doesn't exist; the actual variants are `Open`, `Blocked`, `Remediating`, `Paused`, etc. Fix: use `CycleStatus::Open`. **No production change.**
2. **Composite FK `(project_id, cycle_id)` on `capability_receipts`**: `cycle_id: None` would NOT satisfy the FK (NULL doesn't match a real cycle row). Fix: set `cycle_id: Some("c-cap")` and seed the corresponding cycle. **No production change.**
3. **`cycles` requires `(project_id, workspace_id) → workspaces`**: a `CycleRecord` insert fails with FK violation if no `WorkspaceRecord` exists for the (project_id, workspace_id) pair. The seed helper must insert project + workspace + cycle. **No production change.**

These surprises validate that the FK constraints are doing real work — exactly the kind of canary the cycle asked for.


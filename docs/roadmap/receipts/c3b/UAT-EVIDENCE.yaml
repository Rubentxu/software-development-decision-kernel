## STOP conditions

None hit. The only mid-cycle surprise was:
- **expected** `content_hash_mismatch` (pre-transaction guard) but **observed** `duplicate_event_id:<id>` (dup-probe guard). Both are typed; the test was rewritten to accept either guard, with the strong assertion that the stored payload is NOT overwritten. **No production code change required**.


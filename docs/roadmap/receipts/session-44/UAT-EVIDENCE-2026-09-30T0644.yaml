# Receipt session-44 — el push rechazado, su causa raíz, y el bloqueo

> **Lo que NO se hizo, declarado de entrada:** no se publicó ningún
> release. No existe tag `v2.2.32` ni release en GitHub. El último
> release público sigue siendo **`v2.2.27`**. `origin/main` sigue en
> `5440b2e8`: los **45** commits de esta sesión y todas las sesiones
> anteriores siguen sin publicar.

## Resultado

El primer paso que session-43b dejó escrito **se ejecutó y falló**:

```text
git push origin main
ERROR: Push to main rejected — no real release contract found in range.
HOOK_EXIT=1
```

## El hallazgo: no era un bump pendiente, era un predicado insatisfacible

El puntero de session-43b anticipaba que el commit `061afe26`
(`chore(release): bump version`) desbloquearía el push. **No lo hizo, y
no porque el bump faltara: porque no bumpeó nada.** Su padre ya era
`2.2.32`.

La causa real es una **contradicción de baselines entre dos gates** que
preguntan lo mismo con referencias distintas:

| Gate | Baseline | Dice |
|---|---|---|
| `githooks/pre-push` (predicado A) | rango `origin/main..HEAD` | `HOOK_EXIT=1` REJECT |
| `release_admission_check_v2` | último tag publicado (`v2.2.27`) | `ACCEPT ... 2.2.27 -> 2.2.32` |

El bump a `2.2.32` se commiteó en `3d4e457a`, que **ya es ancestro de
`origin/main`**. En el rango `5440b2e8..ad6c6e63` **ningún commit
cambia `[workspace.package] version`** — comprobado commit por commit,
salida vacía. El cambio ocurrió 44 commits antes de `origin/main`: es
inobservable por construcción, no por descuido.

**Los dos gates no se contradicen: cada uno tiene razón sobre su propia
pregunta.** Por eso el rojo no se negotiaba: no había waiver que pedir,
había una referencia que no cuadraba.

El auto-desbloqueo tampoco existe. `scripts/release-bump.sh` se niega a
derivar un bump:

```text
workspace (2.2.32) is ahead of last tag (v2.2.27); the workspace declares
the pending release (2.2.32), no bump to derive
```

Se desactiva **justo** cuando hay un release pendiente declarado, que es
el caso para el que existe.

## Falsación (clon aislado, sin red, remoto real intacto)

El hook se invocó **directamente**, no vía `git push`, para que el exit
code fuera el del hook:

| Escenario | Hook | Admission |
|---|---|---|
| Rango real, sin bump (**control**) | `HOOK_EXIT=1` | `ACCEPT 2.2.27 -> 2.2.32` |
| Bump real `2.2.32 -> 2.2.33` | `HOOK_EXIT=0` | `ACCEPT 2.2.27 -> 2.2.33` |
| Los 45 commits + este commit documental | `HOOK_EXIT=1` | — |

**Corrección de método, declarada.** Una primera medición dio `REJECT`
después del bump y se registró como «el hook rechaza incluso un bump
real». Era **falso**: `cmd | hook && echo ACCEPT || echo REJECT` mide
el exit code de `head`, no el del hook. Repetido con captura explícita:
`HOOK_EXIT=0`. Cuarta vez que un artefacto de medición —no el código—
afirma algo falso (preceden INC-DEBT-033, INC-DEBT-037 y los dos bugs
del guard de autenticidad en session-43).

## Consecuencia en cascada

El rojo de `tests/test_release_state_pointer.sh` (2 checks: `current_sha`
no está en `origin/main`, y va 40 commits por detrás) **no es deuda
independiente**: es consecuencia mecánica de este bloqueo. No se
"reparó" ni se maquilló la tolerancia.

## Desviación de contrato registrada

`AGENTS.md` §2.1 afirmaba que el hook «rechaza push a main sin commit
`chore(release): bump version`». **Eso describe el hook ceremonial
retirado**, no el vigente: el actual rechaza el marker ceremonial
*vacío* y exige un cambio de versión real o un rango docs-only. Esa
frase desactualizada es precisamente lo que llevó a session-43b a
creer que el bump de `061afe26` desbloquearía el push. Corregida en
`ad6c6e63`.


decision_request: |
  The roadmap anticipated this fork: the public adapter EXISTS in another repo
  (TypeScript SDK on npm, protocol v1 stable, schema drift checked mechanically
  in both directions). Options for the SDDK side:
    (a) ADR of equivalence: declare @1jehuang/jcode-sdk the official host
        boundary; SDDK consumes it via a small Node sidecar instead of a Rust
        adapter. No duplicate protocol implementation.
    (b) Rust adapter speaking the v1 socket protocol directly (jcode api-bridge),
        duplicating what the TS SDK does — requires ongoing schema-drift sync.
  The C2c UATs T15-T18 are now evaluable END-TO-END with a live model (only the
  streaming/burst cadence needs provider quota). This session deliberately did
  NOT build (b) — building a duplicate before the ADR is exactly what the
  roadmap forbids ("antes de implementar uno duplicado").


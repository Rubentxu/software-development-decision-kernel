## ADR-0141

`docs/architecture/adrs/ADR-0141-MIGRATION-AUTHORITY-MONOTONIC-ONLY.md` (accepted 2026-09-22).

Declares the migration authority as **monotonic-only**: `user_version` always advances forward; `pre_flight_check` detects catalog-ahead-of-version state and aborts before any DDL.

Related: ADR-0097 (common revision substrate — fail-closed pattern origin).

## Surprises during execution (real, not pre-planned)

### S1: pre-flight catch sequence is migration-order, not catalog-order

**Observation:** When `user_version` is rewound to 10 (catalog has tables from MIGRATION_2..=20), the pre-flight iterates `PRE_FLIGHT_ARTIFACTS` in migration-order and returns the **lowest** migration whose artifact is found. For v=10 rewind, that's MIGRATION_11 (`workflow_runs_v1`) — even though there are earlier migrations with tables present (MIGRATION_5, MIGRATION_6, MIGRATION_9).

**Why:** The pre-flight is designed to give the operator a clear "where to start recovery from" hint. Returning the lowest conflicting migration maps to the earliest point at which the catalog diverged from `user_version`.

**Pin:** T28-1, T27-3 (updated), T28-4, T28-5 all assert on the **lowest** conflicting migration, not all of them.

### S2: `SddkErrorCode` trait is in `sddk-domain`, not `sddk-storage`

**Symptom:** T28-6 uses `err.code()` and `err.recovery()`, which are methods on the `sddk_domain::SddkErrorCode` trait. The first build failed with `no method named code found for enum StorageError`.

**Fix:** Added `use sddk_domain::SddkErrorCode` to `schema_resilience_tests`. No production code change. Build passes after the import.

### S3: format-only difference in `artifact_column_exists`

**Symptom:** First `cargo fmt --check` reported a multi-line method-chain formatting difference in the new `artifact_column_exists` helper.

**Fix:** `cargo fmt --all` applied. No semantic change. Re-verification: clippy + tests + format all green.


## Out-of-scope (NOT_RUN, deferred)

- **Hardening individual migrations with `IF NOT EXISTS` /
  `pragma_table_info` guards** — explicitly rejected by ADR-0141.
  The pre-flight approach is sufficient and lower risk.
- **Multi-process migration race tests** — out of scope.
- **Pre-flight perf bench** — not gated. Sub-millisecond overhead
  expected; measured informally as ~0.2ms on a populated DB.
- **`PRE_FLIGHT_ARTIFACTS` ↔ `MIGRATION_N` consistency test** — would
  be a `#[test]` that ensures every future migration adds its
  artifact to the table. Documented as a future hardening in
  ADR-0141 §Consequences.


## Bugs reales encontrados por los tests

1. **Replay no idempotente**: el `seq` de `ContextBasis` se incrementaba en
   cada llamada, así que el binding mutaba siempre. El servicio ahora deriva el
   basis con `next_basis()`, que sólo avanza cuando la revisión cambia.
2. **Clave de capsule irresoluble**: `cycle_key` devolvía `cycle:<id>`, pero
   `FilesystemCapsuleStore` indexa por `<workflow_run>:<node>:<attempt>.json` y
   compara el **primer** componente. La `:` hacía la búsqueda imposible: el
   read-reuse de capsule NUNCA habría funcionado en producción. Corregido a
   `cycle-<id>`, con el sentinel `no-active-cycle` para el scope de proyecto.

## Falsadores (RED observado, revertido)

| Falsador | Test que cayó | Resultado |
|----------|---------------|-----------|
| Eliminar la guarda `previous.revision == revision` de `next_basis` | `repeated_bootstrap_is_idempotent` | RED: "replay must not rewrite" |
| Elidir `apply_adoption` en `converge_adoption` | `bootstrap_converges_adoption_on_disk` | RED: "adoption receipt was not written" |

El segundo falsador eludió `converge_adoption` de forma que compilaba, porque un
`return` temprano dejaba `status` sin definir. Sin la observación en disco, el
falsador habría pasado inadvertido: el service reportaba `complete` sin haber
convergido nada. Por eso existe `bootstrap_converges_adoption_on_disk`.


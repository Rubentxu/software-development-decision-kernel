## CTX-004 — inferencia tipada

- 0 leases → `no_active_cycle` (con `project_id` y hint).
- 1 lease → `resolved` con el `cycle_id`.
- N leases → `ambiguous` con la lista de `candidates` (cycle_id, owner, expires_at_ms).
- `--cycle <id>` → `explicit`, sin inferencia.

El último estado (1 lease) no tiene test dedicado: la única vía para dejar un
lease activo es escribir en el ledger, que es gate humano. Queda como
`NOT_RUN` declarado, no como PASS.


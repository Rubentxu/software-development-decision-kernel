## Decisión de versión

El histórico sugería **MINOR** por 6 `feat` + 12 `fix`. Pero
`release-bump.sh` deriva del último **tag** (`v2.2.27`) y el workspace
ya declaraba `2.2.32` por delante, así que se negaba a derivar bumped:

```
workspace (2.2.32) is ahead of last tag (2.2.27); the workspace
declares the pending release (2.2.32), no bump to derive
```

Se aplicó `--force-version 2.2.32`. Según `AGENTS.md §2.3` el
workspace version es el **puntero ceremonial del release**: cualquier
otra opción habría saltado la versión pendiente que el contrato exige
publicar. El bump **fusionó** el bloque de CHANGELOG en la sección
`## [2.2.32]` existente en vez de duplicarla (74 líneas añadidas).


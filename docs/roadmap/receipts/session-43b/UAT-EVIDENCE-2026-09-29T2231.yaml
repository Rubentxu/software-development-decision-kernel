## El hallazgo: el perfil completo destapó trabajo que nadie había visto

`cargo test --workspace` dio `TEST_EXIT=101` con **4 tests FAILED** en
`crates/sddk-cli/tests/run_view_cli.rs`. No eran una regresión: eran
**tests que codificaban como correcto el defecto que session-42
eliminó**.

Los cuatro afirmaban `exit 0` y una `RunStateView` bien formada para
run ids que no existen en ningún store. Es decir: **fijaban la
fabricación de INC-DEBT-039 como contrato.** Y no es un detalle
cosmético — sin fuente real, "exit 0" sólo puede significar "invento",
así que el test defendía exactamente el comportamiento peligroso.

Un test así no falla cuando el defecto se corrige: **falla en la
dirección opuesta**, y como nadie lo ejecutó tras session-42, el rojo
vivió 1 sesión sin que nadie lo notara.

Los tests reescritos ahora fijan el contrato fail-closed. El test de
texto pasó de *exigir* las dos cabeceras de sección a **prohibirlas**:
exigirlas era exigir que el comando anunciara un run state que no había
leído.

### Segundo defecto, encontrado por el falsador y no por lectura

Al construir el test que exige "error JSON tipado", resultó que el
payload **no era JSON válido**: se armaba con `format!` y contenía un
`;` crudo dentro del mensaje. Session-42 arregló el código de salida
pero nunca comprobó que la carga útil fuera parseable.

En un canal legible por máquina ese es el peor modo de fallo: un
consumidor ve no-JSON y no tiene forma de distinguirlo de un fallo de
transporte — indistinguible de "el proceso murió".

Corregido construyendo el payload con `serde_json::json!`, válido por
construcción y no por escaping.

## Falsación (RED → GREEN, mutación de producción)

Se mutó `load_run_state_view` para devolver
`RunStateView::for_test(RunOrigin::Declared, …, vec![], vec![], vec![])`
— es decir, reintroducir la vista fabricada.

| Estado | Resultado observado |
|---|---|
| Con mutante | **FAILED. 0 passed; 4 failed** |
| Revertido | **ok. 4 passed; 0 failed** |

Repetido **después** del fix del JSON para comprobar que arreglar el
payload no ablandó las aserciones: 4 RED con mutante, 4 GREEN
revertido. La primera mutación no compiló (campos privados), lo que se
registra como FALSACIÓN NO VÁLIDA y se corrigió usando el constructor
`for_test` real antes de darla por buena.


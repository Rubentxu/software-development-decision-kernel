schema_version: 2
plan_id: sddk-canonical-evolution
baseline:
  release: v1.88.3
  reconciled_at: 2026-09-06
purpose: >-
  Machine-readable, dependency-ordered execution spine for SDDK. This file tells an
  agent exactly what to resume, what to start next, and what terminal state means.

status_vocabulary:
  terminal: [SHIPPED, ABSORBED, SUPERSEDED]
  executable: [ACTIVE, READY, PARTIAL]
  non_executable: [PROPOSED, BLOCKED]

selection_rule:
  - If exactly one item is ACTIVE, resume that item.
  - If more than one item is ACTIVE, fail closed and reconcile planning state.
  - If no item is ACTIVE, scan items by ascending order.
  - Select the first non-terminal item whose dependencies are all terminal.
  - If that item is PROPOSED, promote it to READY only when its acceptance contract is present.
  - If that item is BLOCKED, stop the line and report the blocker; do not skip ahead.
  - Bind the selected semantic work item to a concrete cycle/run ID only when execution starts.
  - A cycle/run ID is evidence of execution, never the identity of the capability.
  - On completion, attach evidence, move the item to SHIPPED or ABSORBED, then recompute next.

cycle_binding:
  identity: semantic_work_item_id
  execution_instance: cycle_or_run_id
  rule: one ACTIVE semantic work item at a time on the canonical spine

terminal_goal:
  id: GA-002
  condition: >-
    SDDK reaches GA with the canonical runtime, Decision Plane, agent/human control,
    durable continuity and Git-like Decision Memory, typed delegation/synthesis,
    advanced operators and bounded decision-search strategies, assurance/UAT,
    adaptive SDD, graph/cockpit, governed learning, multi-pack proof,
    supply-chain controls and production hardening validated by evidence.

horizons:
  - { id: H0, name: Reconcile & Deterministic Foundations }
  - { id: H1, name: Planning SSOT }
  - { id: H2, name: Generated Workflow MVP }
  - { id: H3, name: Decision Plane }
  - { id: H4, name: AgentHost, Context Compiler & Decision Memory }
  - { id: H5, name: Human & Reactive Control }
  - { id: H6, name: Runtime Completeness, Decision Search & Workflow Lab }
  - { id: H7, name: Engineering Assurance & UAT }
  - { id: H8, name: Adaptive SDD }
  - { id: H9, name: Active Graph & Cockpit }
  - { id: H10, name: Governed Continuous Improvement }
  - { id: H11, name: Multi-pack Proof }
  - { id: H12, name: Supply Chain, Production Hardening & GA }

